<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Случайный таймер</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #111111;
      --foreground: #ffffff;
      --button-background: #303030;
      --idle-background: #000000;
      --waiting-background: #123F2D;
      --active-background: #b42318;
      --back-button-background: #123F2D;
      --divider: rgb(255 255 255 / 15%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .result {
      min-height: 96px;
      display: grid;
      place-items: center;
      font-size: clamp(64px, 22vw, 96px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      user-select: none;
      will-change: transform, opacity;
    }

    .result.is-updated {
      animation: result-feedback 160ms ease-out;
    }

    button {
      width: 100%;
      min-height: 72px;
      border: 0;
      border-radius: 18px;
      padding: 18px 24px;
      background: var(--button-background);
      color: var(--foreground);
      font: inherit;
      font-size: 20px;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      will-change: transform;
    }

    button.is-pressed {
      animation: button-feedback 140ms ease-out;
    }

    .delay-input-group {
      width: 100%;
      display: grid;
      gap: 6px;
    }

    .delay-prompt {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--foreground);
    }

    .delay-input {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--foreground) 35%, transparent);
      border-radius: 12px;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      font-size: 20px;
      font-weight: 650;
      line-height: 1.35;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow-x: hidden;
      overflow-y: hidden;
      resize: none;
    }

    .delay-input:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .delay-input::placeholder {
      color: var(--foreground);
      opacity: 0.65;
    }

    .delay-display {
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .delay-display[hidden],
    .delay-input[hidden] {
      display: none;
    }

    .delay-input[aria-invalid="true"] {
      border-color: var(--active-background);
    }

    .input-message {
      min-height: 1.2em;
      margin: 0;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.75;
    }

    .delay-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .delay-edit-button {
      grid-column: 1 / -1;
    }

    .delay-input[readonly] {
      caret-color: transparent;
    }

    .delay-edit-button,
    .delay-cancel-button,
    .delay-apply-button,
    .cycle-reset-button {
      min-height: 56px;
      background: transparent;
      border: 1px solid currentColor;
      font-size: 17px;
      opacity: 0.88;
    }

    .delay-edit-button:disabled,
    .delay-cancel-button:disabled,
    .delay-apply-button:disabled,
    .cycle-reset-button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .cycle-actions {
      display: grid;
      gap: 14px;
    }

    .cycle-status {
      min-height: 1.2em;
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.35;
      text-align: center;
      opacity: 0.75;
    }

    .reset-cycle-dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background: rgb(0 0 0 / 72%);
    }

    .reset-cycle-dialog-overlay[hidden] {
      display: none;
    }

    .reset-cycle-dialog {
      width: min(100%, 420px);
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid color-mix(in srgb, var(--foreground) 28%, transparent);
      border-radius: 18px;
      background: var(--background);
      box-shadow: 0 18px 48px rgb(0 0 0 / 55%);
    }

    .reset-cycle-dialog-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      text-align: center;
    }

    .reset-cycle-dialog-description {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
      opacity: 0.78;
    }

    .reset-cycle-dialog-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .reset-cycle-dialog-button {
      min-height: 56px;
      padding: 14px 16px;
      font-size: 17px;
    }

    .reset-cycle-dialog-confirm {
      background: var(--active-background);
    }

    .signal-button {
      background: transparent;
      color: var(--foreground);
      border: 2px solid currentColor;
    }

    .signal-button.is-active {
      background: var(--active-background);
      color: var(--foreground);
      border-color: var(--active-background);
    }

    .test-button {
      background: transparent;
      color: var(--foreground);
      border: 1px solid currentColor;
      opacity: 0.88;
    }

    .test-button.is-counting {
      border-style: dashed;
    }

    .test-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .control-group {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .control-label-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
    }

    .control-group label,
    .control-label-row {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }

    .control-group label,
    .control-label-row span:first-child {
      opacity: 0.72;
    }

    .volume-value {
      font-variant-numeric: tabular-nums;
    }

    select {
      width: 100%;
      min-height: 56px;
      border: 1px solid currentColor;
      border-radius: 14px;
      padding: 0 16px;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
      font-size: 17px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--foreground);
    }

    select:focus-visible,
    input[type="range"]:focus-visible,
    button:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 4px;
    }

    @keyframes result-feedback {
      0% {
        transform: scale(0.86);
        opacity: 0.35;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes button-feedback {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(0.96);
      }

      100% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .result.is-updated {
        animation: result-feedback-reduced 100ms linear;
      }

      button.is-pressed {
        animation: button-feedback-reduced 100ms linear;
      }

      @keyframes result-feedback-reduced {
        0% {
          opacity: 0.4;
        }

        100% {
          opacity: 1;
        }
      }

      @keyframes button-feedback-reduced {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.72;
        }
      }
    }
  
    main {
      width: 100%;
      min-height: 100dvh;
      padding: 0;
      display: block;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100dvh;
    }

    .home-screen {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
      font-size: clamp(32px, 10vmin, 88px);
      --gear-size: 0.72em;
      --gear-hit-size: 1.44em;
      --version-font-size: 0.333em;
    }

    .primary-control {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      border-radius: 0;
      background: var(--idle-background);
      color: var(--foreground);
      font-size: 1em;
      font-weight: 700;
      line-height: 1;
    }

    .primary-control.is-active {
      background: var(--active-background);
      color: var(--foreground);
      border-color: var(--active-background);
    }

    .primary-control.is-stopping {
      background: var(--waiting-background);
      color: var(--foreground);
      border-color: var(--waiting-background);
    }

    .settings-toggle {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 2;
      width: var(--gear-hit-size);
      height: var(--gear-hit-size);
      min-width: var(--gear-hit-size);
      min-height: var(--gear-hit-size);
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      line-height: 1;
    }

    .settings-icon {
      display: block;
      width: var(--gear-size);
      height: var(--gear-size);
      fill: currentColor;
    }

    .home-version {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 2;
      margin: 0;
      font-size: var(--version-font-size);
      line-height: 1.2;
      color: var(--foreground);
      opacity: 0.55;
      pointer-events: none;
      user-select: none;
    }

    .settings-toggle .settings-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (orientation: landscape) {
      .home-screen {
        font-size: clamp(28px, 10vmin, 72px);
      }
    }

    .settings-panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      min-height: 100dvh;
      overflow-y: auto;
      background: var(--background);
      color: var(--foreground);
      padding: 0;
      box-sizing: border-box;
    }

    .settings-header {
      position: sticky;
      top: 0;
      z-index: 1;
      width: 100%;
      margin: 0;
      padding:
        max(16px, env(safe-area-inset-top))
        max(20px, calc((100% - 420px) / 2))
        16px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      background: var(--background);
      border-bottom: 1px solid var(--divider);
    }

    .settings-title {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      min-width: 0;
      color: var(--foreground);
      font-size: 24px;
    }

    .settings-header h2 {
      margin: 0;
      font-size: 1em;
      line-height: 1.2;
    }

    .settings-title-icon {
      display: block;
      flex: 0 0 auto;
      width: 0.72em;
      height: 0.72em;
      fill: currentColor;
    }

    .settings-close {
      min-height: 44px;
      width: auto;
      padding-inline: 18px;
      background: var(--back-button-background);
      color: var(--foreground);
      border-color: var(--back-button-background);
    }

    .settings-content {
      width: min(calc(100% - 40px), 420px);
      margin: 0 auto;
      padding-bottom: 24px;
    }

    .settings-section {
      display: grid;
      gap: 14px;
      padding: 28px 0;
      border-bottom: 1px solid var(--divider);
    }

    .settings-section-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: var(--foreground);
    }

    .settings-version-section {
      padding: 28px 0 max(8px, env(safe-area-inset-bottom));
      border-bottom: 0;
    }

    .test-details {
      width: 100%;
      border-top: 1px solid color-mix(in srgb, var(--foreground) 28%, transparent);
      padding-top: 12px;
    }

    .test-details summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--foreground);
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      list-style: none;
    }

    .test-details summary::-webkit-details-marker {
      display: none;
    }

    .test-details summary::after {
      content: "▾";
      font-size: 2em;
      line-height: 1;
      transform: rotate(-90deg);
      transition: transform 140ms ease-out;
    }

    .test-details[open] summary::after {
      transform: rotate(0deg);
    }

    .test-details-content {
      display: grid;
      gap: 14px;
      padding-top: 14px;
    }

    .version-label {
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
      opacity: 0.55;
      padding-bottom: env(safe-area-inset-bottom);
    }

  </style>
</head>

<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="gear-icon" viewBox="0 0 64 64">
        <mask id="gear-icon-mask">
          <rect width="64" height="64" fill="white"></rect>
          <circle cx="32" cy="32" r="13.2" fill="black"></circle>
        </mask>
        <g fill="currentColor" mask="url(#gear-icon-mask)">
          <rect id="gear-tooth" x="26" y="2" width="12" height="16" rx="4"></rect>
          <use href="#gear-tooth" transform="rotate(45 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(90 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(135 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(180 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(225 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(270 32 32)"></use>
          <use href="#gear-tooth" transform="rotate(315 32 32)"></use>
          <circle cx="32" cy="32" r="22"></circle>
        </g>
      </symbol>
    </defs>
  </svg>
  <main id="appMain">
    <section class="app" aria-label="Случайный таймер">
      <section class="home-screen" aria-label="Главный экран">
        <button
          class="primary-control"
          id="primaryControl"
          type="button"
        >
          Включить
        </button>

        <button
          class="settings-toggle"
          id="settingsToggle"
          type="button"
          aria-label="Открыть настройки"
          aria-expanded="false"
          aria-controls="settingsPanel"
        >
          <svg
            class="settings-icon"
            viewBox="0 0 64 64"
            aria-hidden="true"
          >
            <use href="#gear-icon"></use>
          </svg>
          <span class="settings-label">Настройки</span>
        </button>

        <p class="home-version"></p>
      </section>

      <section
        class="settings-panel"
        id="settingsPanel"
        aria-label="Настройки и отладка"
        hidden
      >
        <div class="settings-header">
          <div class="settings-title">
            <svg
              class="settings-title-icon"
              viewBox="0 0 64 64"
              aria-hidden="true"
            >
              <use href="#gear-icon"></use>
            </svg>
            <h2>Настройки</h2>
          </div>
          <button
            class="settings-close"
            id="settingsClose"
            type="button"
          >
            Назад
          </button>
        </div>

        <div class="settings-content">
          <section class="settings-section" aria-labelledby="pauseSectionTitle">
            <h3 class="settings-section-title" id="pauseSectionTitle">Пауза перед сигналом</h3>

            <output class="result" id="result" aria-live="polite"></output>

            <div class="delay-input-group">
              <p class="delay-prompt">Введите паузы. Множитель указывается через *: 5s*3 — три паузы по 5 секунд; *0 отключает паузу. Разделители — запятая или новая строка.</p>
              <div
                class="delay-input delay-display"
                id="delayDisplay"
                role="textbox"
                aria-readonly="true"
                tabindex="0"
                aria-label="Применённые паузы"
                aria-describedby="delayMessage"
              ></div>
              <textarea
                class="delay-input"
                id="delayInput"
                rows="1"
                inputmode="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                hidden
                aria-describedby="delayMessage"
                aria-errormessage="delayMessage"
              ></textarea>
              <p class="input-message" id="delayMessage" aria-live="polite"></p>
              <div class="delay-actions">
                <button
                  class="delay-edit-button"
                  id="editDelaysButton"
                  type="button"
                  aria-controls="delayInput"
                >
                  Редактировать
                </button>
                <button
                  class="delay-cancel-button"
                  id="cancelDelaysButton"
                  type="button"
                  hidden
                  disabled
                >
                  Отмена
                </button>
                <button
                  class="delay-apply-button"
                  id="applyDelaysButton"
                  type="button"
                  hidden
                  disabled
                >
                  Сохранить
                </button>
              </div>
            </div>

            <div class="cycle-actions">
              <button id="generateButton" type="button">Выбрать из оставшихся</button>
              <button
                class="cycle-reset-button"
                id="resetCycleButton"
                type="button"
                disabled
              >
                Сбросить цикл
              </button>
            </div>

            <p
              class="cycle-status"
              id="selectedCycleStatus"
              aria-live="polite"
            ></p>

            <p
              class="cycle-status"
              id="cycleStatus"
              aria-live="polite"
            ></p>
          </section>

          <section class="settings-section" aria-labelledby="signalSectionTitle">
            <h3 class="settings-section-title" id="signalSectionTitle">Сигнал</h3>

            <button
              class="signal-button"
              id="signalButton"
              type="button"
              aria-pressed="false"
            >
              Включить сигнал
            </button>

            <div class="control-group">
              <label for="signalSelect">Сигнал</label>
              <select id="signalSelect">
                <option value="steady">Ровный тон</option>
                <option value="low">Низкий гул</option>
                <option value="dual">Двойной тон</option>
                <option value="siren">Сирена</option>
                <option value="pulse">Пульс</option>
              </select>
            </div>

            <div class="control-group">
              <div class="volume-row">
                <label for="volumeControl">Громкость</label>
                <output id="volumeValue" for="volumeControl"></output>
              </div>
              <input
                id="volumeControl"
                type="range"
                min="0"
                max="100"
                step="1"
              >
            </div>

            <details class="test-details">
              <summary>Тестирование</summary>
              <div class="test-details-content">
                <button
                  class="test-button"
                  id="testButton"
                  type="button"
                  aria-describedby="testStatus"
                >
                  Тест (5 секунд)
                </button>

                <button
                  class="test-button"
                  id="randomTestButton"
                  type="button"
                  aria-describedby="testStatus"
                >
                  Тест (случайно)
                </button>

                <span id="testStatus" aria-live="polite" hidden></span>
              </div>
            </details>
          </section>

          <footer class="settings-section settings-version-section version-label"></footer>
        </div>
      </section>
    </section>
  </main>

  <div
    class="reset-cycle-dialog-overlay"
    id="resetCycleDialogOverlay"
    aria-hidden="true"
    hidden
  >
    <section
      class="reset-cycle-dialog"
      id="resetCycleDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resetCycleDialogTitle"
      aria-describedby="resetCycleDialogDescription"
    >
      <h2
        class="reset-cycle-dialog-title"
        id="resetCycleDialogTitle"
      >
        Сбросить цикл?
      </h2>

      <p
        class="reset-cycle-dialog-description"
        id="resetCycleDialogDescription"
      >
        Выбранные паузы и состояние текущего цикла будут очищены.
      </p>

      <div class="reset-cycle-dialog-actions">
        <button
          class="reset-cycle-dialog-button"
          id="resetCycleCancelButton"
          type="button"
        >
          Отмена
        </button>
        <button
          class="reset-cycle-dialog-button reset-cycle-dialog-confirm"
          id="resetCycleConfirmButton"
          type="button"
        >
          Сбросить
        </button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const APP_CONFIG = Object.freeze({
        version: "0.9.10",
        defaults: Object.freeze({
          delays: "2s, 5s, 10s, 2m30s",
          signal: "steady",
          volume: 30
        }),
        storageKeys: Object.freeze({
          delays: "random_timer.delays",
          signal: "random_timer.signal",
          volume: "random_timer.volume"
        }),
        feedback: Object.freeze({
          vibrationMilliseconds: 20
        }),
        delayValidation: Object.freeze({
          debounceMilliseconds: 750
        }),
        signalTypes: Object.freeze([
          "steady",
          "low",
          "dual",
          "siren",
          "pulse"
        ])
      });

      const AppMode = Object.freeze({
        IDLE: "idle",
        WAITING: "waiting",
        SIGNALING: "signaling"
      });

      const TestId = Object.freeze({
        FIXED: "fixed",
        RANDOM: "random"
      });

      const UI_TEXT = Object.freeze({
        versionPrefix: "Версия",

      const SettingsStore = (() => {
        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (error) {
            console.warn(`Не удалось прочитать настройку ${key}`, error);
            return null;
          }
        }

        function write(key, value) {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch (error) {
            console.warn(`Не удалось сохранить настройку ${key}`, error);
            return false;
          }
        }

        function load() {
          const savedDelays = read(APP_CONFIG.storageKeys.delays);
          const savedSignal = read(APP_CONFIG.storageKeys.signal);
          const savedVolume = read(APP_CONFIG.storageKeys.volume);

          const signal = APP_CONFIG.signalTypes.includes(savedSignal)
            ? savedSignal
            : APP_CONFIG.defaults.signal;

          let volume = APP_CONFIG.defaults.volume;

          if (savedVolume !== null && !Number.isNaN(Number(savedVolume))) {
            volume = Math.min(100, Math.max(0, Number(savedVolume)));
          }

          return {
            delays: savedDelays || APP_CONFIG.defaults.delays,
            signal,
            volume
          };
        }

        return Object.freeze({
          load,
          saveDelays(value) {
            return write(APP_CONFIG.storageKeys.delays, value);
          },
          saveSignal(value) {
            return write(APP_CONFIG.storageKeys.signal, value);
          },
          saveVolume(value) {
            return write(APP_CONFIG.storageKeys.volume, value);
          }
        });
      })();

      const CountdownController = (() => {
        let timeoutId = null;
        let intervalId = null;

        function clear() {
          if (timeoutId !== null) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }

          if (intervalId !== null) {
            clearInterval(intervalId);
            intervalId = null;
          }
        }

        function start(delaySeconds, callbacks) {
          clear();
          let remaining = delaySeconds;

          intervalId = setInterval(() => {
            remaining -= 1;

            if (remaining > 0) {
              callbacks.onTick(remaining);
            }
          }, 1000);

          timeoutId = setTimeout(() => {
            clear();
            callbacks.onElapsed();
          }, delaySeconds * 1000);
        }

        return Object.freeze({
          start,
          clear
        });
      })();

      const AudioSignal = (() => {
        let audioContext = null;
        let oscillator = null;
        let gainNode = null;
        let modulationOscillator = null;
        let modulationGain = null;
        let pulseTimer = null;
        let dualToneTimer = null;
        let cleanupTimer = null;
        let selectedVolume = APP_CONFIG.defaults.volume / 100;
        let signalLevel = 1;
        let resourceGeneration = 0;

        function getAudioContextConstructor() {
          return window.AudioContext || window.webkitAudioContext;
        }

        async function prepare() {
          if (!audioContext) {
            const AudioContextConstructor = getAudioContextConstructor();

            if (!AudioContextConstructor) {
              throw new Error("Web Audio API недоступен");
            }

            audioContext = new AudioContextConstructor();
          }

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
        }

        function clearNodes() {
          if (cleanupTimer !== null) {
            clearTimeout(cleanupTimer);
            cleanupTimer = null;
          }

          if (pulseTimer !== null) {
            clearInterval(pulseTimer);
            pulseTimer = null;
          }

          if (dualToneTimer !== null) {
            clearInterval(dualToneTimer);
            dualToneTimer = null;
          }

          if (modulationOscillator) {
            try {
              modulationOscillator.stop();
            } catch {}
            modulationOscillator = null;
          }

          modulationGain = null;

          if (oscillator) {
            try {
              oscillator.stop();
            } catch {}
            oscillator = null;
          }

          gainNode = null;
        }

        function effectiveVolume() {
          return selectedVolume * signalLevel;
        }

        function applyVolume(target = effectiveVolume()) {
          if (!gainNode || !audioContext) {
            return;
          }

          const now = audioContext.currentTime;
          gainNode.gain.cancelScheduledValues(now);
          gainNode.gain.setTargetAtTime(target, now, 0.015);
        }

        function createBaseSignal(type, frequency, level = 1) {
          signalLevel = level;
          oscillator = audioContext.createOscillator();
          gainNode = audioContext.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;

          gainNode.gain.setValueAtTime(0, audioContext.currentTime);
          gainNode.gain.linearRampToValueAtTime(
            effectiveVolume(),
            audioContext.currentTime + 0.05
          );

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.start();
        }

        function build(type) {
          clearNodes();

          switch (type) {
            case "low":
              createBaseSignal("triangle", 220, 0.75);
              break;

            case "dual":
              createBaseSignal("sine", 660, 0.7);
              dualToneTimer = setInterval(() => {
                if (!oscillator || !audioContext) {
                  return;
                }

                const nextFrequency = oscillator.frequency.value < 800
                  ? 990
                  : 660;
                oscillator.frequency.setTargetAtTime(
                  nextFrequency,
                  audioContext.currentTime,
                  0.015
                );
              }, 280);
              break;

            case "siren":
              createBaseSignal("sine", 700, 0.65);
              modulationOscillator = audioContext.createOscillator();
              modulationGain = audioContext.createGain();

              modulationOscillator.type = "sine";
              modulationOscillator.frequency.value = 0.8;
              modulationGain.gain.value = 350;

              modulationOscillator.connect(modulationGain);
              modulationGain.connect(oscillator.frequency);
              modulationOscillator.start();
              break;

            case "pulse":
              createBaseSignal("sine", 880, 0);
              signalLevel = 0.8;
              pulseTimer = setInterval(() => {
                const now = audioContext.currentTime;
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(
                  effectiveVolume(),
                  now + 0.02
                );
                gainNode.gain.linearRampToValueAtTime(0, now + 0.22);
              }, 700);

              {
                const now = audioContext.currentTime;
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(
                  effectiveVolume(),
                  now + 0.02
                );
                gainNode.gain.linearRampToValueAtTime(0, now + 0.22);
              }
              break;

            case "steady":
            default:
              createBaseSignal("sine", 880, 0.8);
          }
        }

        function play(type, volume) {
          resourceGeneration += 1;
          selectedVolume = volume;
          build(type);
        }

        function rebuild(type, volume) {
          play(type, volume);
        }

        function setVolume(volume, type) {
          selectedVolume = volume;

          if (type !== "pulse") {
            applyVolume();
          }
        }

        function stop() {
          const stoppedGeneration = ++resourceGeneration;

          if (audioContext && gainNode) {
            const now = audioContext.currentTime;
            gainNode.gain.cancelScheduledValues(now);
            gainNode.gain.setValueAtTime(gainNode.gain.value, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.05);
          }

          if (cleanupTimer !== null) {
            clearTimeout(cleanupTimer);
          }

          cleanupTimer = setTimeout(() => {
            if (resourceGeneration === stoppedGeneration) {
              clearNodes();
            }
          }, 70);
        }

        function clearImmediately() {
          resourceGeneration += 1;
          clearNodes();
        }

        return Object.freeze({
          prepare,
          play,
          rebuild,
          setVolume,
          stop,
          clearImmediately
        });
      })();

      function createDomBindings(documentRef) {
        const requiredIds = Object.freeze([
          "appMain",

        const elements = {};
        const missing = [];

        for (const id of requiredIds) {
          const element = documentRef.getElementById(id);

          if (element) {
            elements[id] = element;
          } else {
            missing.push(`#${id}`);
          }
        }

        const versionElements = Array.from(
          documentRef.querySelectorAll(".home-version, .version-label")

        if (versionElements.length === 0) {
          missing.push(".home-version или .version-label");
        }

        if (!documentRef.body) {
          missing.push("document.body");
        }

        if (missing.length > 0) {
          throw new Error(
            `Не удалось инициализировать random_timer: отсутствуют обязательные элементы: ${missing.join(", ")}`
          );
        }

        return Object.freeze({
          ...elements,
          versionElements: Object.freeze(versionElements),
          body: documentRef.body
        });
      }

          });

        function closeResetCycleConfirmation(options = {}) {
          if (!isResetCycleConfirmationOpen()) {
            return false;
          }

          const restoreFocus = options.restoreFocus !== false;
          const focusTarget = options.focusTarget || confirmationFocusTarget;

          resetCycleDialogOverlay.hidden = true;
          resetCycleDialogOverlay.setAttribute("aria-hidden", "true");
          appMain.removeAttribute("inert");

          if (restoreFocus && typeof focusTarget.focus === "function") {
            focusTarget.focus();
          }

          return true;
        }

        function trapResetCycleDialogFocus(event) {
          if (
            event.key !== "Tab" ||
            !isResetCycleConfirmationOpen()
          ) {
            return false;
          }

          const focusable = [
            resetCycleCancelButton,
            resetCycleConfirmButton
          ].filter(element => !element.disabled);

          if (focusable.length === 0) {
            event.preventDefault();
            resetCycleDialog.focus();
            return true;
          }

          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          const activeElement = resetCycleDialog.ownerDocument.activeElement;
          const focusOutsideDialog = !resetCycleDialog.contains(activeElement);

          if (event.shiftKey && (activeElement === first || focusOutsideDialog)) {
            event.preventDefault();
            last.focus();
            return true;
          }

          if (!event.shiftKey && (activeElement === last || focusOutsideDialog)) {
            event.preventDefault();
            first.focus();
            return true;
          }

          return false;
        }

        function animateEditDelays() {
          restartAnimation(editDelaysButton, "is-pressed");
        }

        function animateCancelDelays() {
          restartAnimation(cancelDelaysButton, "is-pressed");
        }

        function animateApplyDelays() {

        }

        function animateResetCycle() {

        }

        function animatePrimary() {

        }

        }

        function animateTest(testId) {

            restartAnimation(buttonElement, "is-pressed");
          }
        }

        function bindAnimationCleanupHandlers() {
          bindAnimationCleanup(result, "is-updated");

          [
            editDelaysButton,
            cancelDelaysButton,
            applyDelaysButton,
            button,
            resetCycleButton,
            signalButton,
            testButton,
            randomTestButton,
            primaryControl
          ].forEach(element => {

          });

        return Object.freeze({
          initialize,
          renderVersion,
          renderState,
          resizeDelayInput,
          getDelayValue,
          setDelayValue,
          setDelayDisplayValue,
          blurDelayInput,
          focusDelayInputForEditing,
          renderDelayEditing,
          focusEditDelaysButton,
          getSignalType,
          getVolumePercent,
          updateVolumeLabel,
          showDelayError,
          clearDelayError,
          renderDelayValidation,
          focusApplyDelaysButton,
          clearResult,
          showSelectedDelay,
          renderCycle,
          setStatus,
          isResetCycleConfirmationOpen,
          openResetCycleConfirmation,
          openApplyDelaysConfirmation,
          closeResetCycleConfirmation,
          trapResetCycleDialogFocus,
          focusGenerateButton,
          openSettings,
          closeSettings,
          animateGenerate,
          animateEditDelays,
          animateCancelDelays,
          animateApplyDelays,
          animateResetCycle,
          animatePrimary,
          animateSignal,
          animateTest,
          bindAnimationCleanupHandlers
        });
      }

      function vibrateFeedback() {
        if ("vibrate" in navigator) {
          navigator.vibrate(APP_CONFIG.feedback.vibrationMilliseconds);
        }
      }

      function parseDelayToken(token) {
        const normalized = token.trim().toLowerCase();
        const match = normalized.match(
          /^(?:(\d+)m)?\s*(?:(\d+)s)?\s*(?:\*(\d+))?$/
        );

        if (!match || (!match[1] && !match[2])) {
          return {
            ok: false,
            errorCode: "invalid-format"
          };
        }

        const minutes = Number(match[1] || 0);
        const seconds = Number(match[2] || 0);
        const multiplier = Number(match[3] ?? 1);
        const totalSeconds = minutes * 60 + seconds;

        if (
          !Number.isSafeInteger(totalSeconds) ||
          totalSeconds <= 0 ||
          !Number.isSafeInteger(multiplier) ||
          multiplier < 0
        ) {
          return {
            ok: false,
            errorCode: "invalid-format"
          };
        }

        if (multiplier > 999) {
          return {
            ok: false,
            errorCode: "multiplier-too-large"
          };
        }

        const source = [
          match[1] ? `${match[1]}m` : "",
          match[2] ? `${match[2]}s` : ""
        ].join("");

        return {
          ok: true,
          delay: {
            source,
            totalSeconds
          },
          multiplier
        };
      }

      function tokenizeDelayList(value) {
        const normalized = value.replace(/\r\n?/g, "\n");
        const tokens = [];

        for (const line of normalized.split("\n")) {
          if (line.trim() === "") {
            continue;
          }

          const lineTokens = line.split(",");

          if (lineTokens.some(token => token.trim() === "")) {
            return {
              ok: false,
              errorCode: "empty-entry",
              invalidToken: ""
            };
          }

          tokens.push(...lineTokens.map(token => token.trim()));
        }

        if (tokens.length === 0) {
          return {
            ok: false,
            errorCode: "invalid-format",
            invalidToken: ""
          };
        }

        return {
          ok: true,
          tokens
        };
      }

      function parseDelayList(value) {
        const tokenized = tokenizeDelayList(value);

        if (!tokenized.ok) {
          return tokenized;
        }

        const parsed = [];

        for (const token of tokenized.tokens) {
          const tokenResult = parseDelayToken(token);

          if (!tokenResult.ok) {
            return {
              ok: false,
              errorCode: tokenResult.errorCode,
              invalidToken: token
            };
          }

          for (
            let index = 0;
            index < tokenResult.multiplier;
            index += 1
          ) {
            parsed.push({ ...tokenResult.delay });
          }
        }

        if (parsed.length === 0) {
          return {
            ok: false,
            errorCode: "no-enabled-delays",
            invalidToken: ""
          };
        }

        return {
          ok: true,
          values: parsed
        };
      }

      function createDelaySignature(values) {
        return JSON.stringify(
          values.map(value => value.totalSeconds)
        );
      }

      function formatPauseCount(count) {
        const absolute = Math.abs(count) % 100;
        const lastDigit = absolute % 10;
        let noun = "пауз";

        if (absolute < 11 || absolute > 14) {
          if (lastDigit === 1) {
            noun = "пауза";
          } else if (lastDigit >= 2 && lastDigit <= 4) {
            noun = "паузы";
          }
        }

        return `${count} ${noun}`;
      }

      function createCryptoRandomSource(cryptoApi) {
        const UINT32_RANGE = 0x100000000;

        function getIndex(length) {
          if (
            !Number.isInteger(length) ||
            length <= 0 ||
            length > UINT32_RANGE
          ) {
            throw new RangeError(
              "Размер диапазона должен быть целым числом от 1 до 2^32"
            );
          }

          if (
            !cryptoApi ||
            typeof cryptoApi.getRandomValues !== "function"
          ) {
            throw new Error("Web Crypto API недоступен");
          }

          const acceptedLimit =
            UINT32_RANGE - (UINT32_RANGE % length);
          const values = new Uint32Array(1);

          do {
            cryptoApi.getRandomValues(values);
          } while (values[0] >= acceptedLimit);

          return values[0] % length;
        }

        return Object.freeze({
          getIndex
        });
      }

      function createDelayCycle(getRandomIndex) {
        let sourceValue = null;
        let fullValues = [];
        let remainingValues = [];
        let selectedValues = [];

        function createStatus(valid = true) {
          return {
            valid,
            total: fullValues.length,
            remaining: remainingValues.length,
            selected: selectedValues.map(value => value.source),
            completed:
              valid &&
              fullValues.length > 0 &&
              remainingValues.length === 0,
            hasUsed:
              valid &&
              fullValues.length > 0 &&
              remainingValues.length < fullValues.length
          };
        }

        function reset(value) {
          const parsed = parseDelayList(value);
          sourceValue = value;

          if (!parsed.ok) {
            fullValues = [];
            remainingValues = [];
            selectedValues = [];

            return {
              ...parsed,
              cycle: createStatus(false)
            };
          }

          fullValues = parsed.values.slice();
          remainingValues = fullValues.slice();
          selectedValues = [];

          return {
            ok: true,
            cycle: createStatus()
          };
        }

        function ensureCurrent(value) {
          if (value !== sourceValue || fullValues.length === 0) {
            return reset(value);
          }

          return {
            ok: true,
            cycle: createStatus()
          };
        }

        function select(value) {
          const prepared = ensureCurrent(value);

          if (!prepared.ok) {
            return prepared;
          }

          if (typeof getRandomIndex !== "function") {
            throw new TypeError(
              "Источник случайных индексов не задан"
            );
          }

          const startsNewCycle = remainingValues.length === 0;
          const selectionPool = startsNewCycle
            ? fullValues
            : remainingValues;
          const index = getRandomIndex(selectionPool.length);

          if (startsNewCycle) {
            remainingValues = fullValues.slice();
            selectedValues = [];
          }

          const [selected] = remainingValues.splice(index, 1);
          selectedValues.push(selected);

          return {
            ok: true,
            selected,
            cycle: createStatus()
          };
        }

        function getStatus() {
          return createStatus(fullValues.length > 0);
        }

        return Object.freeze({
          reset,
          select,
          getStatus
        });
      }

      function createAppController(AppView, RandomSource) {
        const state = {
          mode: AppMode.IDLE,
          activeTestId: null,
          countdownRemaining: null
        };

        let operationSequence = 0;
        let settings = SettingsStore.load();
        const delayCycle = createDelayCycle(
          RandomSource.getIndex
        );
        let appliedDelaySignature = "";
        let delayValidationTimer = null;
        let delayValidationRevision = 0;
        let draftValidation = null;
        let pendingConfirmationAction = null;
        let isDelayEditing = false;

        function beginOperation() {
          operationSequence += 1;
          return operationSequence;
        }

        function invalidatePendingOperations() {
          operationSequence += 1;
        }

        function isCurrentOperation(operationId) {
          return operationSequence === operationId;
        }

        function transitionTo(nextMode, options = {}) {
          const previousMode = state.mode;

          if (previousMode !== nextMode) {
            const allowedTransitions = ALLOWED_MODE_TRANSITIONS[previousMode];

            if (!allowedTransitions?.has(nextMode)) {
              throw new Error(
                `Недопустимый переход состояния: ${previousMode} → ${nextMode}`
              );
            }
          }

          state.mode = nextMode;

          if (nextMode === AppMode.WAITING) {
            state.activeTestId = Object.prototype.hasOwnProperty.call(
              options,
              "activeTestId"
            )
              ? options.activeTestId
              : state.activeTestId;

            state.countdownRemaining =
              Object.prototype.hasOwnProperty.call(
                options,
                "countdownRemaining"
              )
                ? options.countdownRemaining
                : state.countdownRemaining;
          } else {
            state.activeTestId = null;
            state.countdownRemaining = null;
          }

          AppView.renderState(state);
        }

        function updateCountdown(remaining) {
          if (state.mode !== AppMode.WAITING) {
            return;
          }

          state.countdownRemaining = remaining;
          AppView.renderState(state);
          AppView.setStatus(
            `${UI_TEXT.status.countdownPrefix}${remaining}${UI_TEXT.status.countdownSuffix}`
          );
        }

        function cancelTest() {
          invalidatePendingOperations();
          CountdownController.clear();

          if (state.mode === AppMode.WAITING) {
            transitionTo(AppMode.IDLE);
          }

          AppView.setStatus(UI_TEXT.status.cancelled);
        }

        async function startTest(delaySeconds, testId = null) {
          if (state.mode === AppMode.SIGNALING) {
            return false;
          }

          if (state.mode === AppMode.WAITING) {
            cancelTest();
          }

          CountdownController.clear();
          const operationId = beginOperation();

          transitionTo(AppMode.WAITING, {
            activeTestId: testId,
            countdownRemaining: delaySeconds
          });
          AppView.setStatus(
            `${UI_TEXT.status.countdownPrefix}${delaySeconds}${UI_TEXT.status.countdownSuffix}`
          );

          try {
            await AudioSignal.prepare();
          } catch (error) {
            if (isCurrentOperation(operationId)) {
              CountdownController.clear();
              transitionTo(AppMode.IDLE);
              AppView.setStatus(UI_TEXT.status.audioPrepareFailed);
            }

            console.error("Не удалось подготовить аудио", error);
            return false;
          }

          if (
            !isCurrentOperation(operationId) ||
            state.mode !== AppMode.WAITING
          ) {
            return false;
          }

          CountdownController.start(delaySeconds, {
            onTick(remaining) {
              if (
                !isCurrentOperation(operationId) ||
                state.mode !== AppMode.WAITING
              ) {
                CountdownController.clear();
                return;
              }

              updateCountdown(remaining);
            },

            async onElapsed() {
              if (
                !isCurrentOperation(operationId) ||
                state.mode !== AppMode.WAITING
              ) {
                return;
              }

              const started = await startSignal();

              if (started) {
                AppView.setStatus(UI_TEXT.status.signalEnabled);
              }
            }
          });

          return true;
        }

        async function startSignal() {
          if (state.mode === AppMode.SIGNALING) {
            return true;
          }

          const operationId = beginOperation();

          try {
            await AudioSignal.prepare();

            if (!isCurrentOperation(operationId)) {
              return false;
            }

            AudioSignal.play(settings.signal, settings.volume / 100);
            transitionTo(AppMode.SIGNALING);
            return true;
          } catch (error) {
            if (isCurrentOperation(operationId)) {
              CountdownController.clear();
              AudioSignal.clearImmediately();

              if (state.mode !== AppMode.IDLE) {
                transitionTo(AppMode.IDLE);
              } else {
                AppView.renderState(state);
              }

              AppView.setStatus(UI_TEXT.status.signalStartFailed);
            }

            console.error("Не удалось включить сигнал", error);
            return false;
          }
        }

        function stopSignal() {
          invalidatePendingOperations();
          AudioSignal.stop();

          if (state.mode === AppMode.SIGNALING) {
            transitionTo(AppMode.IDLE);
          }
        }

        function cancelScheduledDelayValidation() {
          delayValidationRevision += 1;

          if (delayValidationTimer !== null) {
            clearTimeout(delayValidationTimer);
            delayValidationTimer = null;
          }
        }

        function validateDelayDraft(value = AppView.getDelayValue()) {
          const hasTextChanges = value !== settings.delays;
          const result = parseDelayList(value);

          if (!result.ok) {
            draftValidation = {
              state: "invalid",
              value,
              result,
              hasTextChanges
            };
            AppView.renderDelayValidation(draftValidation);
            return draftValidation;
          }

          const signature = createDelaySignature(result.values);
          const stateName = signature === appliedDelaySignature
            ? "valid-unchanged"
            : "valid-changed";

          draftValidation = {
            state: stateName,
            value,
            result,
            signature,
            count: result.values.length,
            hasTextChanges
          };
          AppView.renderDelayValidation(draftValidation);
          return draftValidation;
        }

        function scheduleDelayDraftValidation() {
          cancelScheduledDelayValidation();
          const revision = delayValidationRevision;
          const value = AppView.getDelayValue();

          AppView.renderDelayValidation({
            state: "pending",
            hasTextChanges: value !== settings.delays
          });

          delayValidationTimer = setTimeout(() => {
            delayValidationTimer = null;

            if (
              revision !== delayValidationRevision ||
              AppView.getDelayValue() !== value
            ) {
              return;
            }

            validateDelayDraft(value);
          }, APP_CONFIG.delayValidation.debounceMilliseconds);
        }

        function finishDelayEditing(options = {}) {
          isDelayEditing = false;
          AppView.renderDelayEditing(false);

          if (options.focus !== false) {
            AppView.focusEditDelaysButton();
          }
        }

        function applyValidatedDelayDraft(validation) {
          settings.delays = validation.value;
          appliedDelaySignature = validation.signature;
          AppView.setDelayDisplayValue(settings.delays);
          SettingsStore.saveDelays(settings.delays);

          const resetResult = delayCycle.reset(settings.delays);
          AppView.clearResult();
          AppView.renderCycle(
            resetResult.cycle,
            UI_TEXT.cycle.changed
          );

          draftValidation = {
            ...validation,
            state: "valid-unchanged",
            hasTextChanges: false
          };
          AppView.renderDelayValidation(draftValidation);
          AppView.animateApplyDelays();
          finishDelayEditing();
          vibrateFeedback();
        }

        function selectDelay(options = {}) {
          let selection;

          try {
            selection = delayCycle.select(settings.delays);
          } catch (error) {
            AppView.renderCycle(
              delayCycle.getStatus(),
              UI_TEXT.cycle.randomUnavailable
            );

            if (options.clearResultOnError) {
              AppView.clearResult();
            }

            if (options.openSettingsOnError) {
              AppView.openSettings();
            }

            console.error(
              "Не удалось получить случайный индекс",
              error
            );
            return null;
          }

          if (!selection.ok) {
            AppView.showDelayError(selection);
            AppView.renderCycle(
              selection.cycle,
              UI_TEXT.cycle.invalid
            );

            if (options.clearResultOnError) {
              AppView.clearResult();
            }

            if (options.openSettingsOnError) {
              AppView.openSettings();
            }

            return null;
          }

          AppView.showSelectedDelay(selection.selected);
          AppView.renderCycle(selection.cycle);
          return selection.selected;
        }

        async function handleTest(testId) {
          const testConfig = TEST_CONFIG[testId];

          if (!testConfig) {
            throw new Error(`Неизвестный тест: ${testId}`);
          }

          AppView.animateTest(testId);

          if (
            state.mode === AppMode.WAITING &&
            state.activeTestId === testId
          ) {
            cancelTest();
            return;
          }

          let delaySeconds = testConfig.delaySeconds;

          if (testConfig.usesRandomDelay) {
            const selected = selectDelay();

            if (!selected) {
              return;
            }

            delaySeconds = selected.totalSeconds;
          }

          const started = await startTest(delaySeconds, testId);

          if (started) {
            vibrateFeedback();
          }
        }

        function initialize() {
          const loadedDelayText = settings.delays;
          let appliedResult = parseDelayList(loadedDelayText);

          if (!appliedResult.ok) {
            settings.delays = APP_CONFIG.defaults.delays;
            appliedResult = parseDelayList(settings.delays);
            SettingsStore.saveDelays(settings.delays);
          }

          const initialDraftText = settings.delays;

          appliedDelaySignature = createDelaySignature(
            appliedResult.values
          );

          AppView.initialize({
            ...settings,
            delays: initialDraftText
          });
          const initializedCycle = delayCycle.reset(settings.delays);
          AppView.renderCycle(initializedCycle.cycle);
          AppView.renderVersion();
          AppView.renderState(state);
          AppView.bindAnimationCleanupHandlers();
          AppView.renderDelayEditing(false);
          draftValidation = {
            state: "valid-unchanged",
            value: initialDraftText,
            result: appliedResult,
            signature: appliedDelaySignature,
            count: appliedResult.values.length,
            hasTextChanges: false
          };
        }

        return Object.freeze({
          initialize,

          onEditDelays() {
            if (isDelayEditing) {
              return;
            }

            isDelayEditing = true;
            AppView.renderDelayEditing(true);
            validateDelayDraft();
            AppView.animateEditDelays();
            AppView.focusDelayInputForEditing();
          },

          onDelayInput(event) {
            if (!isDelayEditing) {
              return;
            }

            AppView.resizeDelayInput();

            if (event?.inputType === "insertFromPaste") {
              cancelScheduledDelayValidation();
              validateDelayDraft();
              return;
            }

            scheduleDelayDraftValidation();
          },

          onDelayBlur() {
            if (!isDelayEditing) {
              return;
            }

            cancelScheduledDelayValidation();
            validateDelayDraft();
          },

          onCancelDelayDraft() {
            if (!isDelayEditing) {
              return;
            }

            cancelScheduledDelayValidation();
            AppView.setDelayValue(settings.delays);
            AppView.setDelayDisplayValue(settings.delays);
            draftValidation = {
              state: "valid-unchanged",
              value: settings.delays,
              result: parseDelayList(settings.delays),
              signature: appliedDelaySignature,
              hasTextChanges: false
            };
            AppView.resizeDelayInput();
            AppView.animateCancelDelays();
            finishDelayEditing();
          },

          onApplyDelaysRequest() {
            if (!isDelayEditing) {
              return;
            }

            cancelScheduledDelayValidation();
            const validation = validateDelayDraft();

            if (validation.state !== "valid-changed") {
              return;
            }

            if (!delayCycle.getStatus().hasUsed) {
              applyValidatedDelayDraft(validation);
              return;
            }

            if (AppView.openApplyDelaysConfirmation()) {
              pendingConfirmationAction = "apply-delays";
            }
          },

          onViewportResize() {
            AppView.resizeDelayInput();
          },

          onGenerate() {
            if (isDelayEditing) {
              return;
            }

            const selected = selectDelay({
              clearResultOnError: true
            });

            if (!selected) {
              return;
            }

            AppView.animateGenerate();
            vibrateFeedback();
          },

          onResetCycleRequest() {
            if (isDelayEditing) {
              return;
            }

            if (AppView.openResetCycleConfirmation()) {
              pendingConfirmationAction = "reset-cycle";
            }
          },

          onResetCycleCancel() {
            pendingConfirmationAction = null;
            AppView.closeResetCycleConfirmation();
          },

          onResetCycleDialogBackdrop(event) {
            if (event.target === event.currentTarget) {
              pendingConfirmationAction = null;
              AppView.closeResetCycleConfirmation();
            }
          },

          onResetCycleDialogKeydown(event) {
            if (event.key === "Escape") {
              event.preventDefault();
              pendingConfirmationAction = null;
              AppView.closeResetCycleConfirmation();
              return;
            }

            AppView.trapResetCycleDialogFocus(event);
          },

          onResetCycleConfirm() {
            const action = pendingConfirmationAction;
            pendingConfirmationAction = null;

            if (!AppView.closeResetCycleConfirmation({
              restoreFocus: false
            })) {
              return;
            }

            if (action === "apply-delays") {
              cancelScheduledDelayValidation();
              const validation = validateDelayDraft();

              if (validation.state !== "valid-changed") {
                AppView.focusApplyDelaysButton();
                return;
              }

              applyValidatedDelayDraft(validation);
              return;
            }

            if (action !== "reset-cycle") {
              return;
            }

            const resetResult = delayCycle.reset(settings.delays);

            AppView.renderCycle(
              resetResult.cycle,
              resetResult.ok
                ? UI_TEXT.cycle.reset
                : UI_TEXT.cycle.invalid
            );
            AppView.animateResetCycle();
            AppView.focusGenerateButton();

            if (!resetResult.ok) {
              return;
            }

            vibrateFeedback();
          },

          async onPrimaryControl() {
            AppView.animatePrimary();

            switch (state.mode) {
              case AppMode.SIGNALING:
                stopSignal();
                vibrateFeedback();
                break;

              case AppMode.WAITING:
                cancelTest();
                vibrateFeedback();
                break;

              case AppMode.IDLE:
              default: {
                const selected = selectDelay({
                  openSettingsOnError: true
                });

                if (!selected) {
                  return;
                }

                const started = await startTest(selected.totalSeconds);

                if (started) {
                  vibrateFeedback();
                }
              }
            }
          },

          async onSignalButton() {
            AppView.animateSignal();

            if (state.mode === AppMode.SIGNALING) {
              stopSignal();
              vibrateFeedback();
              return;
            }

            if (state.mode === AppMode.WAITING) {
              cancelTest();
            }

            const started = await startSignal();

            if (started) {
              vibrateFeedback();
            }
          },

          onTest(testId) {
            return handleTest(testId);
          },

          onSignalTypeChange() {
            settings.signal = AppView.getSignalType();
            SettingsStore.saveSignal(settings.signal);

            if (state.mode === AppMode.SIGNALING) {
              AudioSignal.rebuild(
                settings.signal,
                settings.volume / 100
              );
            }
          },

          onVolumeInput() {
            settings.volume = AppView.getVolumePercent();
            AppView.updateVolumeLabel();
            SettingsStore.saveVolume(String(settings.volume));

            if (state.mode === AppMode.SIGNALING) {
              AudioSignal.setVolume(
                settings.volume / 100,
                settings.signal
              );
            }
          },

          openSettings() {
            AppView.openSettings();
          },

          closeSettings() {
            AppView.closeSettings();
          }
        });
      }

      function bindEvents(dom, controller) {
        const {
          delayInput,
          editDelaysButton,
          cancelDelaysButton,
          applyDelaysButton,
          generateButton,
          resetCycleButton,
          resetCycleDialogOverlay,
          resetCycleDialog,
          resetCycleCancelButton,
          resetCycleConfirmButton,
          primaryControl,
          signalButton,
          testButton,
          randomTestButton,
          signalSelect,
          volumeControl,
          settingsToggle,
          settingsClose
        } = dom;

        editDelaysButton.addEventListener(
          "click",
          controller.onEditDelays
        );
        delayInput.addEventListener("input", controller.onDelayInput);
        delayInput.addEventListener("blur", controller.onDelayBlur);
        cancelDelaysButton.addEventListener(
          "click",
          controller.onCancelDelayDraft
        );
        applyDelaysButton.addEventListener(
          "click",
          controller.onApplyDelaysRequest
        );
        window.addEventListener("resize", controller.onViewportResize);
        generateButton.addEventListener("click", controller.onGenerate);
        resetCycleButton.addEventListener(
          "click",
          controller.onResetCycleRequest
        );
        resetCycleCancelButton.addEventListener(
          "click",
          controller.onResetCycleCancel
        );
        resetCycleConfirmButton.addEventListener(
          "click",
          controller.onResetCycleConfirm
        );
        resetCycleDialogOverlay.addEventListener(
          "click",
          controller.onResetCycleDialogBackdrop
        );
        resetCycleDialog.addEventListener(
          "keydown",
          controller.onResetCycleDialogKeydown
        );
        primaryControl.addEventListener(
          "click",
          controller.onPrimaryControl
        );
        signalButton.addEventListener(
          "click",
          controller.onSignalButton
        );
        testButton.addEventListener("click", () => {
          return controller.onTest(TestId.FIXED);
        });
        randomTestButton.addEventListener("click", () => {
          return controller.onTest(TestId.RANDOM);
        });
        signalSelect.addEventListener(
          "change",
          controller.onSignalTypeChange
        );
        volumeControl.addEventListener(
          "input",
          controller.onVolumeInput
        );
        settingsToggle.addEventListener(
          "click",
          controller.openSettings
        );
        settingsClose.addEventListener(
          "click",
          controller.closeSettings
        );
      }

      function bootstrap() {
        const dom = createDomBindings(document);
        const view = createAppView(dom);
        const randomSource = createCryptoRandomSource(
          globalThis.crypto
        );
        const controller = createAppController(
          view,
          randomSource
        );

        bindEvents(dom, controller);
        controller.initialize();
      }

      bootstrap();
    })();
  </script>
</body>
</html>
