<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Random Playlist YouTube 0.3.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden; }
    button, input { font: inherit; }

    .setup {
      min-height: 100%; overflow-y: auto; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: #111;
    }
    .card { width: min(100%, 760px); display: grid; gap: 18px; }
    h1 { margin: 0 0 4px; font-size: clamp(26px, 7vw, 38px); line-height: 1.05; }
    .hint { margin: 0; color: #aaa; line-height: 1.45; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input { width: 100%; min-height: 48px; border: 1px solid #444; border-radius: 10px; background: #202020; color: #fff; padding: 10px 12px; outline: none; font-size: 16px; }
    input:focus { border-color: #fff; }

    .episode-table-wrap { width: 100%; max-height: min(55vh, 560px); overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid #333; border-radius: 12px; background: #171717; }
    .episode-table { width: 100%; min-width: 760px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .episode-table th { position: sticky; top: 0; z-index: 2; padding: 10px 6px; color: #bbb; background: #171717; border-bottom: 1px solid #333; font-size: 14px; text-align: left; }
    .episode-table th:first-child { width: 48px; text-align: center; }
    .episode-table th:nth-child(2) { width: 48%; }
    .episode-table th:nth-child(3), .episode-table th:nth-child(4) { width: 14%; }
    .episode-table th:last-child { width: 190px; }
    .episode-table td { padding: 6px; vertical-align: middle; border-bottom: 1px solid #292929; }
    .episode-table tbody tr:last-child td { border-bottom: 0; }
    .episode-table td:first-child { text-align: center; color: #aaa; font-variant-numeric: tabular-nums; }
    .episode-table input { min-height: 44px; }
    .row-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .row-action { min-height: 40px; border: 1px solid #555; border-radius: 9px; background: #202020; color: #ddd; cursor: pointer; font-weight: 700; }
    .row-action:active:not(:disabled) { background: #303030; }
    .row-action:disabled { opacity: .35; cursor: default; }
    .delete-action { color: #ffb4b4; }
    .fragment-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .fragment-count { color: #aaa; font-size: 14px; font-variant-numeric: tabular-nums; }
    .add-fragment { min-height: 44px; padding: 0 16px; }

    .primary { min-height: 54px; border: 0; border-radius: 12px; background: #fff; color: #000; font-weight: 750; cursor: pointer; }
    .secondary { min-height: 48px; border: 1px solid #555; border-radius: 12px; background: transparent; color: #ddd; font-weight: 650; cursor: pointer; }
    .secondary:active { background: #252525; }
    .settings-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .settings-actions .wide { grid-column: 1 / -1; }
    .settings-message { min-height: 1.4em; margin: -8px 0 0; font-size: 14px; color: #9fd49f; }
    .settings-message.error-message { color: #ff8c8c; }
    .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
    .error { min-height: 1.4em; margin: 0; color: #ff8c8c; font-size: 14px; }

    .player-screen { position: fixed; inset: 0; display: none; background: #000; overflow: hidden; }
    .player-screen.active { display: block; }
    #player { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #player iframe { position: absolute; top: 50%; left: 50%; width: max(100vw, calc(100vh * 16 / 9)); height: max(100vh, calc(100vw * 9 / 16)); border: 0; transform: translate(-50%, -50%); pointer-events: none; }
    .interaction-shield { position: absolute; z-index: 4; inset: 0; background: transparent; touch-action: manipulation; }
    .timer { position: absolute; z-index: 5; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); min-width: 82px; padding: 8px 10px; border-radius: 999px; background: rgba(0,0,0,.68); border: 1px solid rgba(255,255,255,.28); color: #fff; text-align: center; font-variant-numeric: tabular-nums; font-weight: 750; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .debug-status { position: absolute; z-index: 6; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); display: none; max-width: calc(100vw - 20px); padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.72); color: #b8ffb8; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .debug-status.visible { display: block; }
    .start-overlay { position: absolute; z-index: 8; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.18); }
    .start-overlay.visible { display: grid; }
    .start-overlay button { min-width: 150px; min-height: 54px; border: 1px solid rgba(255,255,255,.32); border-radius: 999px; background: rgba(0,0,0,.72); color: #fff; font-weight: 750; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .expired { position: absolute; z-index: 7; inset: 0; display: none; place-items: center; padding: 24px; background: rgba(0,0,0,.62); text-align: center; }
    .expired.visible { display: grid; }
    .expired-panel { width: min(100%, 420px); padding: 24px; border: 1px solid rgba(255,255,255,.28); border-radius: 18px; background: rgba(15,15,15,.92); }
    .expired h2 { margin: 0 0 10px; font-size: 30px; }
    .expired p { margin: 0 0 18px; color: #bbb; }
    .expired-actions { display: grid; gap: 10px; }
    .expired button { width: 100%; min-height: 50px; border-radius: 12px; font-weight: 750; }
    .expired .continue-button { border: 0; background: #fff; color: #000; }
    .expired .return-button { border: 1px solid #555; background: transparent; color: #ddd; }
    .expired .return-button:active { background: #252525; }
  </style>
</head>
<body>
  <main id="setup" class="setup">
    <form id="form" class="card" novalidate>
      <div>
        <h1>YouTube с таймером паузы</h1>
        <p class="hint">Версия <span id="appVersion">0.3.0</span></p>
        <p class="hint">Фрагменты воспроизводятся сверху вниз как один смонтированный эпизод. После последнего фрагмента цикл начинается заново и повторяется до истечения времени фактического воспроизведения.</p>
      </div>

      <div class="episode-table-wrap">
        <table class="episode-table" aria-label="Фрагменты смонтированного эпизода">
          <thead><tr><th>№</th><th>Адрес</th><th>Начало</th><th>Конец</th><th>Действия</th></tr></thead>
          <tbody id="fragmentsBody"></tbody>
        </table>
      </div>
      <div class="fragment-actions">
        <span id="fragmentCount" class="fragment-count"></span>
        <button id="addFragment" class="secondary add-fragment" type="button">Добавить фрагмент</button>
      </div>

      <label>Пауза таймера, секунд
        <input id="pauseSeconds" type="number" inputmode="numeric" min="1" step="1" value="60" required>
      </label>

      <button class="primary" type="submit">Показать видео</button>
      <div class="settings-actions">
        <button id="importSettings" class="secondary" type="button">Импорт JSON</button>
        <button id="exportSettings" class="secondary" type="button">Экспорт JSON</button>
        <button id="clearSettings" class="secondary wide" type="button">Сбросить сохранённые данные</button>
      </div>
      <input id="importFile" class="visually-hidden" type="file" accept=".json,application/json">
      <p id="settingsMessage" class="settings-message" role="status" aria-live="polite"></p>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <section id="playerScreen" class="player-screen" aria-label="Видеоплеер">
    <div id="player"></div>
    <div class="interaction-shield" aria-hidden="true"></div>
    <button id="timer" class="timer" type="button" aria-label="Оставшееся время. Нажмите, чтобы вернуться к настройкам">01:00</button>
    <div id="debugStatus" class="debug-status" aria-hidden="true"></div>
    <div id="startOverlay" class="start-overlay"><button id="startPlayback" type="button">Запустить видео</button></div>
    <div id="expired" class="expired" role="dialog" aria-modal="true" aria-labelledby="expiredTitle">
      <div class="expired-panel"><h2 id="expiredTitle">Время истекло</h2><p>Видео поставлено на паузу.</p><div class="expired-actions"><button id="continue" class="continue-button" type="button">Продолжить ещё раз</button><button id="returnToSettings" class="return-button" type="button">Вернуться к настройкам</button></div></div>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const APP_VERSION = '0.3.0';
      const MAX_FRAGMENTS = 100;
      const form = document.getElementById('form');
      const setup = document.getElementById('setup');
      const screen = document.getElementById('playerScreen');
      const error = document.getElementById('error');
      const timerEl = document.getElementById('timer');
      const expiredEl = document.getElementById('expired');
      const continueBtn = document.getElementById('continue');
      const returnToSettingsBtn = document.getElementById('returnToSettings');
      const startOverlay = document.getElementById('startOverlay');
      const startPlaybackBtn = document.getElementById('startPlayback');
      const debugStatus = document.getElementById('debugStatus');
      const debugEnabled = new URLSearchParams(location.search).get('debug') === '1';
      const clearSettingsBtn = document.getElementById('clearSettings');
      const importSettingsBtn = document.getElementById('importSettings');
      const exportSettingsBtn = document.getElementById('exportSettings');
      const importFileInput = document.getElementById('importFile');
      const settingsMessage = document.getElementById('settingsMessage');
      const fragmentsBody = document.getElementById('fragmentsBody');
      const fragmentCount = document.getElementById('fragmentCount');
      const addFragmentBtn = document.getElementById('addFragment');
      const pauseSecondsInput = document.getElementById('pauseSeconds');
      const exportFormat = 'random_playlist_youtube';
      const exportVersion = 2;
      const storageKeyV1 = 'random_playlist_youtube.settings.v1';
      const storageKeyV2 = 'random_playlist_youtube.settings.v2';
      const storageVersion = 2;
      let saveTimerId = null;

      const blankFragment = () => ({ url: '', start: '0', end: '10' });
      let fragments = [blankFragment()];

      let player = null;
      let apiReady = false;
      let pendingStart = false;
      let durationMs = 60000;
      let remainingMs = durationMs;
      let deadline = 0;
      let intervalId = null;
      let expired = false;
      let clips = [];
      let clipIndex = 0;
      let switchingClip = false;
      let expectedVideoId = null;
      let transitionSerial = 0;
      let lastPlayerState = -1;

      function normalizeEditableFragment(value) {
        if (!value || typeof value !== 'object') return null;
        return {
          url: typeof value.url === 'string' ? value.url : '',
          start: typeof value.start === 'string' || typeof value.start === 'number' ? String(value.start) : '0',
          end: typeof value.end === 'string' || typeof value.end === 'number' ? String(value.end) : '10'
        };
      }

      function collectSettings() {
        return {
          version: storageVersion,
          timerSeconds: pauseSecondsInput.value,
          fragments: fragments.map((fragment) => ({ ...fragment }))
        };
      }

      function validateSettingsV2(value) {
        if (!value || typeof value !== 'object' || value.version !== storageVersion) return null;
        if (!Array.isArray(value.fragments) || value.fragments.length > MAX_FRAGMENTS) return null;
        const normalized = value.fragments.map(normalizeEditableFragment);
        if (normalized.some((fragment) => fragment === null)) return null;
        return {
          version: storageVersion,
          timerSeconds: typeof value.timerSeconds === 'string' || typeof value.timerSeconds === 'number' ? String(value.timerSeconds) : '60',
          fragments: normalized.length ? normalized : [blankFragment()]
        };
      }

      function migrateSettingsV1ToV2(value) {
        if (!value || typeof value !== 'object' || value.version !== 1 || !Array.isArray(value.fragments)) return null;
        if (value.fragments.length > MAX_FRAGMENTS) return null;
        const normalized = value.fragments.map(normalizeEditableFragment);
        if (normalized.some((fragment) => fragment === null)) return null;
        return {
          version: storageVersion,
          timerSeconds: typeof value.pauseSeconds === 'string' || typeof value.pauseSeconds === 'number' ? String(value.pauseSeconds) : '60',
          fragments: normalized.length ? normalized : [blankFragment()]
        };
      }

      function createFragmentRow(fragment, index) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td><input class="video-url" data-field="url" data-index="${index}" type="url" inputmode="url" autocomplete="url" placeholder="https://youtu.be/…" aria-label="Адрес фрагмента ${index + 1}"></td>
          <td><input class="episode-start" data-field="start" data-index="${index}" type="number" inputmode="decimal" min="0" step="0.1" aria-label="Начало фрагмента ${index + 1}, секунд"></td>
          <td><input class="episode-end" data-field="end" data-index="${index}" type="number" inputmode="decimal" min="0.1" step="0.1" aria-label="Конец фрагмента ${index + 1}, секунд"></td>
          <td><div class="row-actions">
            <button class="row-action" data-action="up" data-index="${index}" type="button" aria-label="Переместить фрагмент ${index + 1} вверх" ${index === 0 ? 'disabled' : ''}>↑</button>
            <button class="row-action" data-action="down" data-index="${index}" type="button" aria-label="Переместить фрагмент ${index + 1} вниз" ${index === fragments.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="row-action delete-action" data-action="delete" data-index="${index}" type="button" aria-label="Удалить фрагмент ${index + 1}" ${fragments.length === 1 ? 'disabled' : ''}>Удалить</button>
          </div></td>`;
        row.querySelector('[data-field="url"]').value = fragment.url;
        row.querySelector('[data-field="start"]').value = fragment.start;
        row.querySelector('[data-field="end"]').value = fragment.end;
        return row;
      }

      function renderFragmentsTable(focusIndex = null) {
        fragmentsBody.replaceChildren(...fragments.map(createFragmentRow));
        fragmentCount.textContent = `Фрагментов: ${fragments.length} из ${MAX_FRAGMENTS}`;
        addFragmentBtn.disabled = fragments.length >= MAX_FRAGMENTS;
        if (focusIndex !== null) {
          fragmentsBody.querySelector(`[data-field="url"][data-index="${focusIndex}"]`)?.focus();
        }
      }

      function applySettings(settings) {
        fragments = settings.fragments.map((fragment) => ({ ...fragment }));
        if (fragments.length === 0) fragments = [blankFragment()];
        pauseSecondsInput.value = settings.timerSeconds;
        renderFragmentsTable();
      }

      function saveSettings() {
        saveTimerId = null;
        try { localStorage.setItem(storageKeyV2, JSON.stringify(collectSettings())); } catch (_) {}
      }

      function scheduleSave() {
        if (saveTimerId !== null) clearTimeout(saveTimerId);
        saveTimerId = window.setTimeout(saveSettings, 300);
      }

      function loadSettings() {
        let rawV2 = null;
        try { rawV2 = localStorage.getItem(storageKeyV2); } catch (_) { return; }
        if (rawV2) {
          try {
            const settings = validateSettingsV2(JSON.parse(rawV2));
            if (!settings) throw new Error('invalid v2 settings');
            applySettings(settings);
            return;
          } catch (_) {
            try { localStorage.removeItem(storageKeyV2); localStorage.removeItem(storageKeyV1); } catch (_) {}
          }
        }

        let rawV1 = null;
        try { rawV1 = localStorage.getItem(storageKeyV1); } catch (_) { return; }
        if (!rawV1) return;
        try {
          const migrated = migrateSettingsV1ToV2(JSON.parse(rawV1));
          if (!migrated) throw new Error('invalid v1 settings');
          applySettings(migrated);
          try { localStorage.setItem(storageKeyV2, JSON.stringify(migrated)); } catch (_) {}
          showSettingsMessage('Настройки 0.2.2 перенесены в формат 0.3.0.');
        } catch (_) {}
      }

      function clearSettings() {
        if (!window.confirm('Удалить сохранённые адреса, границы фрагментов и длительность таймера?')) return;
        if (saveTimerId !== null) { clearTimeout(saveTimerId); saveTimerId = null; }
        try { localStorage.removeItem(storageKeyV2); } catch (_) {}
        pauseTicking();
        try { player?.pauseVideo(); } catch (_) {}
        startOverlay.classList.remove('visible');
        screen.classList.remove('active');
        setup.hidden = false;
        expiredEl.classList.remove('visible');
        applySettings({ version: storageVersion, timerSeconds: '60', fragments: [blankFragment()] });
        error.textContent = '';
        showSettingsMessage('Сохранённые данные удалены.');
      }

      function showSettingsMessage(text, isError = false) {
        settingsMessage.textContent = text;
        settingsMessage.classList.toggle('error-message', isError);
      }

      function validateImportedData(value) {
        if (!value || typeof value !== 'object') throw new Error('Файл не содержит объект конфигурации.');
        if (value.format !== exportFormat) throw new Error('Файл не является конфигурацией random_playlist_youtube.');
        if (value.version !== 1 && value.version !== 2) throw new Error(`Версия формата ${String(value.version)} не поддерживается.`);
        if (!Number.isInteger(value.timerSeconds) || value.timerSeconds < 1) throw new Error('timerSeconds должен быть целым числом не меньше 1.');
        if (!Array.isArray(value.fragments)) throw new Error('Поле fragments должно быть массивом.');
        if (value.fragments.length > MAX_FRAGMENTS) throw new Error(`Поддерживается не более ${MAX_FRAGMENTS} фрагментов.`);

        const normalized = value.fragments.map((fragment, index) => {
          if (!fragment || typeof fragment !== 'object') throw new Error(`Фрагмент ${index + 1} имеет неверную структуру.`);
          const url = typeof fragment.url === 'string' ? fragment.url : '';
          const start = Number(fragment.start);
          const end = Number(fragment.end);
          if (!Number.isFinite(start) || start < 0) throw new Error(`Фрагмент ${index + 1}: start должен быть числом не меньше 0.`);
          if (!Number.isFinite(end) || end <= 0) throw new Error(`Фрагмент ${index + 1}: end должен быть числом больше 0.`);
          if (url.trim() && end <= start) throw new Error(`Фрагмент ${index + 1}: end должен быть больше start.`);
          return { url, start: String(start), end: String(end) };
        });

        return {
          version: storageVersion,
          timerSeconds: String(value.timerSeconds),
          fragments: normalized.length ? normalized : [blankFragment()]
        };
      }

      function validateDataForExport(settings) {
        const timerSeconds = Number(settings.timerSeconds);
        if (!Number.isInteger(timerSeconds) || timerSeconds < 1) throw new Error('Пауза таймера должна быть целым числом не меньше 1.');
        if (!Array.isArray(settings.fragments) || settings.fragments.length < 1 || settings.fragments.length > MAX_FRAGMENTS) {
          throw new Error(`Конфигурация должна содержать от 1 до ${MAX_FRAGMENTS} строк.`);
        }
        const exportFragments = settings.fragments.map((fragment, index) => {
          const url = typeof fragment.url === 'string' ? fragment.url.trim() : '';
          if (!url) return { url: '', start: 0, end: 10 };
          const start = Number(fragment.start);
          const end = Number(fragment.end);
          if (!Number.isFinite(start) || start < 0) throw new Error(`Фрагмент ${index + 1}: начало должно быть числом не меньше 0.`);
          if (!Number.isFinite(end) || end <= 0) throw new Error(`Фрагмент ${index + 1}: конец должен быть числом больше 0.`);
          if (end <= start) throw new Error(`Фрагмент ${index + 1}: конец должен быть больше начала.`);
          return { url, start, end };
        });
        return { format: exportFormat, version: exportVersion, timerSeconds, fragments: exportFragments };
      }

      function exportSettingsToJson() {
        showSettingsMessage('');
        let data;
        try { data = validateDataForExport(collectSettings()); }
        catch (exportError) { showSettingsMessage(exportError.message, true); return; }
        const now = new Date();
        const pad = (value) => String(value).padStart(2, '0');
        const filename = `random_playlist_youtube_config_${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}.json`;
        const blob = new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        showSettingsMessage('Конфигурация JSON v2 экспортирована.');
      }

      async function importSettingsFromJson(file) {
        showSettingsMessage('');
        try {
          const imported = validateImportedData(JSON.parse(await file.text()));
          applySettings(imported);
          saveSettings();
          error.textContent = '';
          showSettingsMessage('Конфигурация импортирована.');
        } catch (importError) {
          showSettingsMessage(importError instanceof SyntaxError ? 'Файл не является корректным JSON.' : importError.message, true);
        } finally { importFileInput.value = ''; }
      }

      function configurePlayback(target) {
        if (!target) return;
        try { target.unloadModule?.('captions'); } catch (_) {}
        try { target.setPlaybackQuality?.('hd720'); } catch (_) {}
      }

      function extractVideoId(raw) {
        const value = raw.trim();
        if (/^[A-Za-z0-9_-]{11}$/.test(value)) return value;
        let url;
        try { url = new URL(value); } catch { return null; }
        const host = url.hostname.replace(/^www\./, '').toLowerCase();
        let id = null;
        if (host === 'youtu.be') id = url.pathname.split('/').filter(Boolean)[0];
        else if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
          if (url.pathname === '/watch') id = url.searchParams.get('v');
          else {
            const parts = url.pathname.split('/').filter(Boolean);
            if (['embed', 'shorts', 'live'].includes(parts[0])) id = parts[1];
          }
        }
        return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
      }

      function formatTime(ms) {
        const seconds = Math.max(0, Math.ceil(ms / 1000));
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }

      function renderTimer() { timerEl.textContent = formatTime(remainingMs); }
      function stopTicking() { if (intervalId !== null) { clearInterval(intervalId); intervalId = null; } }

      function currentClip() { return clips[clipIndex] || null; }

      function playerStateName(state) {
        const names = { '-1': 'UNSTARTED', 0: 'ENDED', 1: 'PLAYING', 2: 'PAUSED', 3: 'BUFFERING', 5: 'CUED' };
        return names[state] || String(state);
      }

      function actualVideoId() {
        try { return player?.getVideoData?.().video_id || ''; } catch (_) { return ''; }
      }

      function updateDebug(extra = '') {
        if (!debugEnabled) return;
        debugStatus.classList.add('visible');
        const clip = currentClip();
        const current = (() => { try { return player?.getCurrentTime?.().toFixed(2) || '0.00'; } catch (_) { return '?'; } })();
        debugStatus.textContent = `clip ${clipIndex + 1}/${clips.length || 0} · ${playerStateName(lastPlayerState)} · t=${current} · actual=${actualVideoId() || '-'} · expected=${expectedVideoId || '-'}${extra ? ' · ' + extra : ''}`;
      }

      function completeTransitionIfReady() {
        if (!switchingClip) return;
        const clip = currentClip();
        if (!clip) return;
        const actual = actualVideoId();
        if (actual && actual !== clip.videoId) {
          updateDebug('ожидание videoId');
          return;
        }
        switchingClip = false;
        expectedVideoId = null;
        updateDebug('переход завершён');
      }

      function loadCurrentClip(autoplay = true) {
        const clip = currentClip();
        if (!player || !clip || expired) return;
        switchingClip = true;
        expectedVideoId = clip.videoId;
        transitionSerial += 1;
        configurePlayback(player);
        updateDebug('loadVideoById');
        try {
          player.loadVideoById({ videoId: clip.videoId, startSeconds: clip.start });
          if (!autoplay) player.pauseVideo();
        } catch (_) {
          switchingClip = false;
          expectedVideoId = null;
          updateDebug('ошибка загрузки');
        }
      }

      function advanceClip() {
        if (switchingClip || expired || clips.length === 0) return;
        const previousClip = currentClip();
        const nextIndex = (clipIndex + 1) % clips.length;
        const nextClip = clips[nextIndex];
        clipIndex = nextIndex;
        switchingClip = true;
        expectedVideoId = nextClip.videoId;
        transitionSerial += 1;
        pauseTicking();

        try {
          if (previousClip && previousClip.videoId === nextClip.videoId) {
            updateDebug('seekTo того же видео');
            player.seekTo(nextClip.start, true);
            player.playVideo();
            window.setTimeout(() => {
              if (!switchingClip || currentClip() !== nextClip) return;
              const actual = actualVideoId();
              if (!actual || actual === nextClip.videoId) {
                completeTransitionIfReady();
                try { if (player.getPlayerState() === YT.PlayerState.PLAYING) startTicking(); } catch (_) {}
              }
            }, 120);
          } else {
            updateDebug('load другого видео');
            player.loadVideoById({ videoId: nextClip.videoId, startSeconds: nextClip.start });
          }
        } catch (_) {
          switchingClip = false;
          expectedVideoId = null;
          updateDebug('ошибка перехода');
          startOverlay.classList.add('visible');
        }
      }

      function enforceSequence() {
        const clip = currentClip();
        if (!player || !clip || expired || switchingClip) return;
        try {
          const currentTime = player.getCurrentTime();
          if (Number.isFinite(currentTime) && currentTime >= clip.end - 0.08) advanceClip();
        } catch (_) {}
      }

      function syncRemaining() {
        if (!deadline) return;
        remainingMs = Math.max(0, deadline - Date.now());
        renderTimer();
        if (remainingMs <= 0) { expireTimer(); return; }
        enforceSequence();
      }

      function startTicking() {
        if (expired || remainingMs <= 0 || intervalId !== null) return;
        deadline = Date.now() + remainingMs;
        intervalId = window.setInterval(syncRemaining, 120);
        syncRemaining();
      }

      function pauseTicking() {
        if (intervalId !== null) syncRemaining();
        stopTicking();
        deadline = 0;
      }

      function expireTimer() {
        if (expired) return;
        expired = true; remainingMs = 0; renderTimer(); stopTicking(); deadline = 0;
        try { player?.pauseVideo(); } catch (_) {}
        expiredEl.classList.add('visible');
      }

      function resetTimer() {
        stopTicking(); expired = false; remainingMs = durationMs; deadline = 0;
        expiredEl.classList.remove('visible'); renderTimer();
      }

      function createPlayerIfNeeded() {
        if (!apiReady) { pendingStart = true; return; }
        if (player) { loadCurrentClip(true); return; }

        const clip = currentClip();
        player = new YT.Player('player', {
          width: '100%', height: '100%', videoId: clip.videoId,
          playerVars: {
            autoplay: 1, controls: 0, disablekb: 1, playsinline: 1, rel: 0,
            fs: 0, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0,
            start: Math.floor(clip.start),
            origin: location.origin === 'null' ? undefined : location.origin
          },
          events: {
            onReady(event) {
              configurePlayback(event.target);
              try { event.target.seekTo(currentClip().start, true); event.target.playVideo(); } catch (_) {}
            },
            onStateChange(event) {
              lastPlayerState = event.data;
              updateDebug();
              if (event.data === YT.PlayerState.PLAYING) {
                const clip = currentClip();
                const actual = actualVideoId();
                if (clip && actual && actual !== clip.videoId) {
                  pauseTicking();
                  updateDebug('PLAYING не того videoId');
                  return;
                }
                completeTransitionIfReady();
                startOverlay.classList.remove('visible');
                configurePlayback(event.target);
                startTicking();
              } else if (event.data === YT.PlayerState.ENDED && !expired) {
                pauseTicking();
                if (!switchingClip) advanceClip();
              } else {
                pauseTicking();
              }
            },
            onApiChange(event) { configurePlayback(event.target); },
            onAutoplayBlocked() { pauseTicking(); switchingClip = false; expectedVideoId = null; updateDebug('autoplay blocked'); startOverlay.classList.add('visible'); },
            onError() { pauseTicking(); switchingClip = false; expectedVideoId = null; updateDebug('YouTube error'); error.textContent = `YouTube не смог загрузить видео ${clipIndex + 1}. Проверьте ссылку и разрешение на встраивание.`; }
          }
        });
      }

      function readClips() {
        const playableFragments = fragments.filter((fragment) => fragment.url.trim() !== '');
        const result = [];
        for (const fragment of playableFragments) {
          const sourceIndex = fragments.indexOf(fragment);
          const address = fragment.url.trim();
          const videoId = extractVideoId(address);
          const start = Number(fragment.start);
          const end = Number(fragment.end);
          if (!videoId) throw new Error(`Строка ${sourceIndex + 1}: введите корректную ссылку YouTube или идентификатор видео.`);
          if (!Number.isFinite(start) || start < 0) throw new Error(`Строка ${sourceIndex + 1}: начало должно быть числом не меньше 0.`);
          if (!Number.isFinite(end) || end <= start) throw new Error(`Строка ${sourceIndex + 1}: конец должен быть больше начала.`);
          result.push({ videoId, start, end });
        }
        if (result.length === 0) throw new Error('Заполните хотя бы одну строку таблицы.');
        return result;
      }

      async function tryPageFullscreen() {
        const request = screen.requestFullscreen || screen.webkitRequestFullscreen;
        if (!request) return;
        try { await request.call(screen); } catch (_) {}
      }

      fragmentsBody.addEventListener('input', (event) => {
        const input = event.target.closest('input[data-field][data-index]');
        if (!input) return;
        const index = Number(input.dataset.index);
        if (!Number.isInteger(index) || !fragments[index]) return;
        fragments[index][input.dataset.field] = input.value;
        scheduleSave();
      });
      fragmentsBody.addEventListener('change', scheduleSave);
      fragmentsBody.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action][data-index]');
        if (!button || button.disabled) return;
        const index = Number(button.dataset.index);
        if (!Number.isInteger(index) || !fragments[index]) return;
        if (button.dataset.action === 'delete') {
          if (fragments.length === 1) return;
          fragments.splice(index, 1);
          renderFragmentsTable(Math.min(index, fragments.length - 1));
        } else if (button.dataset.action === 'up' && index > 0) {
          [fragments[index - 1], fragments[index]] = [fragments[index], fragments[index - 1]];
          renderFragmentsTable(index - 1);
        } else if (button.dataset.action === 'down' && index < fragments.length - 1) {
          [fragments[index + 1], fragments[index]] = [fragments[index], fragments[index + 1]];
          renderFragmentsTable(index + 1);
        }
        saveSettings();
      });
      addFragmentBtn.addEventListener('click', () => {
        if (fragments.length >= MAX_FRAGMENTS) return;
        fragments.push(blankFragment());
        renderFragmentsTable(fragments.length - 1);
        saveSettings();
      });
      pauseSecondsInput.addEventListener('input', scheduleSave);
      pauseSecondsInput.addEventListener('change', scheduleSave);
      clearSettingsBtn.addEventListener('click', clearSettings);
      exportSettingsBtn.addEventListener('click', exportSettingsToJson);
      importSettingsBtn.addEventListener('click', () => importFileInput.click());
      importFileInput.addEventListener('change', () => {
        const file = importFileInput.files?.[0];
        if (file) importSettingsFromJson(file);
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault(); error.textContent = '';
        const seconds = Number(pauseSecondsInput.value);
        if (!Number.isFinite(seconds) || seconds < 1 || !Number.isInteger(seconds)) {
          error.textContent = 'Пауза должна быть целым числом не меньше 1 секунды.'; return;
        }
        try { clips = readClips(); } catch (validationError) { error.textContent = validationError.message; return; }

        saveSettings();
        clipIndex = 0; switchingClip = false; expectedVideoId = null; transitionSerial = 0; durationMs = seconds * 1000; resetTimer();
        startOverlay.classList.remove('visible'); setup.hidden = true; screen.classList.add('active');
        createPlayerIfNeeded(); tryPageFullscreen();
      });

      async function returnToSetup() {
        pauseTicking();
        try { player?.pauseVideo(); } catch (_) {}
        startOverlay.classList.remove('visible'); screen.classList.remove('active'); setup.hidden = false; expiredEl.classList.remove('visible');
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          try { const exit = document.exitFullscreen || document.webkitExitFullscreen; await exit?.call(document); } catch (_) {}
        }
      }

      timerEl.addEventListener('click', returnToSetup);
      returnToSettingsBtn.addEventListener('click', returnToSetup);
      startPlaybackBtn.addEventListener('click', () => {
        startOverlay.classList.remove('visible');
        try { player?.seekTo(currentClip().start, true); player?.playVideo(); } catch (_) {}
      });
      continueBtn.addEventListener('click', () => {
        resetTimer(); clipIndex = 0; switchingClip = false; expectedVideoId = null; loadCurrentClip(true);
      });

      document.addEventListener('visibilitychange', () => { if (!document.hidden && intervalId !== null) syncRemaining(); });
      window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pendingStart) { pendingStart = false; createPlayerIfNeeded(); } };

      const apiScript = document.createElement('script');
      apiScript.src = 'https://www.youtube.com/iframe_api'; apiScript.async = true; document.head.appendChild(apiScript);
      if (debugEnabled) debugStatus.classList.add('visible');
      document.getElementById('appVersion').textContent = APP_VERSION;
      renderFragmentsTable();
      loadSettings();
      renderTimer();
      updateDebug('готово');
    })();
  </script>
</body>
</html>
