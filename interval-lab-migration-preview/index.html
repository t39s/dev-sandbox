<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111b"><title>Interval Lab — переход в sidesteps</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:17px/1.5 system-ui,sans-serif;background:#08111b;color:#edf4fa;margin:0}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}h1{font-size:1.65rem;line-height:1.2}h2{font-size:1.12rem}
p,.note{color:#bacbd8}section{border:1px solid #45586a;border-radius:15px;padding:18px;margin:16px 0;background:#112234}
button,.button{display:block;width:100%;border:0;border-radius:12px;background:#b2e2cc;color:#102c24;font-weight:750;font-size:1.05rem;padding:15px 12px;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5}label.profile{display:block;border:1px solid #556b7e;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}
label.profile:has(input:checked){border-color:#a9e7d1;background:#203d40}input[type=radio]{accent-color:#a9e7d1}
small{color:#b6c5cf;display:block}.error{color:#ffb8b8}.note{font-size:.9rem}
</style></head><body><main id="migration"><h1>Переход в sidesteps</h1><p>Проверяем сохранённую историю…</p></main>
<script src="./model.js"></script><script src="./migration-gateway.js" defer></script></body></html>
