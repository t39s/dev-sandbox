<!doctype html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }}</title>
  <style>
    :root { --ink:#23303c; --muted:#596878; --deep:#17324b; --accent:#145f91; --line:#d5dfe8; --bg:#f2f5f8; --paper:#fff; --panel:#f7fafc; --ring:#005fcc; }
    * {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
    button,a {touch-action:manipulation}
    a {color:var(--accent);text-underline-offset:3px}
    :focus-visible {outline:3px solid var(--ring);outline-offset:3px}
    .skip {position:absolute;left:-9999px;z-index:50;background:#fff;padding:.5rem}
    .skip:focus {left:.5rem;top:.5rem}
    .mast {background:var(--deep);color:#fff;font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
    .mast-inner {max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.2rem}
    .mast .title {font-size:.92rem;font-weight:650}
    .mast-nav {display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}
    .mast a {color:#e7f2fa}
    button {font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
    .action {border:1px solid #b8d8ed;border-radius:7px;background:#f6fbff;color:#114a73;padding:.55rem .8rem}
    .action:disabled {opacity:.42;cursor:not-allowed}
    .chapter-nav {display:none;max-width:1120px;margin:0 auto;padding:.75rem 1.1rem;font:14px/1.5 system-ui,sans-serif}
    .chapter-nav.active {display:block}
    .chapter-nav strong {display:block;color:var(--muted)}
    .chapter-nav a {display:inline-block;margin:.3rem 1.1rem .1rem 0}
    .paper {max-width:1120px;margin:1rem auto 2rem;padding:2.8rem 3.7rem 3.6rem;background:var(--paper);box-shadow:0 5px 28px rgba(30,48,60,.08);border:1px solid var(--line);border-radius:8px}
    h1,h2,h3,h4,h5 {font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.34;color:var(--deep);overflow-wrap:anywhere;scroll-margin-top:1rem}
    h1 {font-size:clamp(1.7rem,3vw,2.2rem);margin:1.4rem 0 1.6rem}
    h2 {font-size:clamp(1.28rem,2.4vw,1.7rem);margin:3.1rem 0 1.2rem;border-bottom:1px solid var(--line);padding-bottom:.55rem}
    h3 {font-size:1.18rem;margin:2.1rem 0 .8rem}
    h4 {font-size:1.05rem;margin:1.6rem 0 .65rem}
    p,ul,ol {margin:0 0 1.05rem}
    li {margin:.3rem 0}
    table {display:block;width:100%;overflow-x:auto;border-collapse:collapse;font-size:.9rem}
    th,td {padding:.5rem .6rem;border:1px solid var(--line)}
    pre {white-space:pre;overflow-x:auto;max-width:100%;padding:1rem;background:var(--panel);border:1px solid var(--line);font-size:.78rem}
    .paper img {display:block;max-width:100%;height:auto}
    .paper > p:has(> img[src*="/assets/crops/photos-"]),
    .paper > p:has(> img[src*="/assets/crops/chart-"]) {margin:1.25rem auto 1.5rem;max-width:900px}
    img[src*="/assets/crops/photos-"],img[src*="/assets/crops/chart-"] {width:100%;border-radius:3px}
    .chart-transcript {display:none}
    .exercise-card {display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);align-items:start;gap:1.2rem;padding:1.1rem;margin:1.2rem 0 1.5rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);scroll-margin-top:1rem}
    .exercise-figure {min-width:0;background:#fff;padding:.6rem;border:1px solid #e1e7ec;border-radius:7px}
    .exercise-figure img {width:100%;height:auto;object-fit:contain}
    .exercise-figure p {margin:0}
    .exercise-copy {min-width:0;overflow-wrap:anywhere}
    .exercise-copy > :last-child {margin-bottom:0}
    .exercise-meta {display:block;font:600 .76rem/1.4 system-ui,sans-serif;color:#44667e;margin-bottom:.4rem}
    .exercise-link {display:block;font:600 12px/1.3 system-ui,sans-serif;margin-top:.5rem}
    .footer {font:13px/1.5 system-ui,sans-serif;color:var(--muted);text-align:center;padding:0 1rem 2rem}
    .reader {position:fixed;inset:0;z-index:100;background:#edf2f6;display:none;flex-direction:column;height:100vh;height:100dvh}
    .reader.open {display:flex}
    .reader-bar {flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem .8rem;background:var(--deep);color:#fff;padding:.55rem max(.8rem,env(safe-area-inset-right)) .55rem max(.8rem,env(safe-area-inset-left));font:600 14px/1.3 system-ui,sans-serif}
    .reader-controls {display:flex;align-items:center;gap:.4rem}
    .reader .action {padding:.45rem .7rem}
    .reader-title {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .reader-grid {flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:.8rem;padding:.7rem;overflow:hidden}
    .reader-visual,.reader-text {min-width:0;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px}
    .reader-visual {display:flex;align-items:flex-start;justify-content:center;padding:1rem}
    .reader-visual img {width:100%;height:auto;max-height:calc(100dvh - 115px);object-fit:contain}
    .reader-text {padding:1.2rem 1.5rem;font:17px/1.58 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
    .reader-text > :last-child {margin-bottom:0}
    .reader-text .exercise-meta {margin-bottom:.7rem}
    body.reader-open {overflow:hidden}
    @media(max-width:760px) {
      body {font-size:16px}
      .paper {margin:0;border:0;border-radius:0;box-shadow:none;padding:1.5rem 1rem 2.5rem}
      .chapter-nav {padding:.6rem 1rem}
      .exercise-card {gap:.7rem;padding:.7rem;grid-template-columns:minmax(0,38%) minmax(0,1fr)}
      .reader-grid {grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:.5rem;padding:.5rem}
      .reader-visual {padding:.5rem}
      .reader-text {padding:.8rem;font-size:15px}
      .reader-bar {font-size:12px}
    }
    @media(max-width:620px) and (orientation:portrait) {
      .exercise-card {grid-template-columns:minmax(0,1fr)}
      .exercise-figure {max-width:330px;margin:0 auto;width:100%}
      .reader-grid {grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(110px,39%) minmax(0,1fr)}
      .reader-visual {align-items:center}
      .reader-visual img {height:100%;max-height:100%;width:auto;max-width:100%}
      .reader-title {max-width:43vw}
    }
    @media print {
      body {background:#fff}
      .mast,.chapter-nav,.reader,.footer,.exercise-link,.exercise-launch {display:none!important}
      .paper {margin:0;max-width:none;padding:0;box-shadow:none;border:0}
      .exercise-card {break-inside:avoid}
      .chart-transcript {display:none!important}
    }
  </style>
</head>
<body>
<a class="skip" href="#publication">К сборнику</a>
<header class="mast"><div class="mast-inner">
  <span class="title">Особенности обучения технике и тактике настольного тенниса в КНР · 2011</span>
  <nav class="mast-nav" aria-label="Ссылки">
    <button type="button" id="open-reader" class="action" hidden>Упражнения</button>
    <a href="https://github.com/t39s/dev-sandbox/blob/main/s88t/index.md">Markdown</a>
    <a href="https://github.com/t39s/dev-sandbox/tree/main/s88t">Исходники</a>
  </nav>
</div></header>
<nav id="chapters" class="chapter-nav" aria-label="Оглавление разделов"></nav>
<main class="paper" id="publication">{{ content }}</main>
<footer class="footer">Федерация настольного тенниса России · Москва, 2011. Иллюстрации — из исходного сборника.</footer>
<div id="exercise-reader" class="reader" role="dialog" aria-modal="true" aria-label="Режим просмотра упражнений" aria-hidden="true">
 <div class="reader-bar">
  <span class="reader-title" id="reader-title"></span>
  <div class="reader-controls">
   <button class="action" id="reader-prev" type="button" aria-label="Предыдущее упражнение">← Назад</button>
   <span id="reader-count" aria-live="polite"></span>
   <button class="action" id="reader-next" type="button" aria-label="Следующее упражнение">Далее →</button>
   <button class="action" id="reader-close" type="button">Закрыть ✕</button>
  </div>
 </div>
 <div class="reader-grid"><div class="reader-visual" id="reader-visual"></div><div class="reader-text" id="reader-text"></div></div>
</div>
<script>
(function () {
  'use strict';
  const main=document.getElementById('publication');
  const nav=document.getElementById('chapters');
  const labels={
   'a1-1':'Приложение 1 · 1. Начало атаки после короткого приема',
   'a1-2':'Приложение 1 · 2. Топ-спин справа',
   'a1-3':'Приложение 1 · 3. Передвижение',
   'a1-4':'Приложение 1 · 4. Передвижение',
   'a2-1':'Приложение 2 · 1. Скидка справа',
   'a2-2':'Приложение 2 · 2. Передвижение и начало атаки',
   'a2-3':'Приложение 2 · 3. Усиление после начала атаки',
   'a2-4':'Приложение 2 · 4. Усиление после начала атаки',
   'a2-5':'Приложение 2 · 5. Передвижение',
   'a2-6':'Приложение 2 · 6. Передвижение',
   'a2-7':'Приложение 2 · 7. Реакция и начало атаки справа',
   'a2-8':'Приложение 2 · 8. Реакция и атака справа',
   'a2-9':'Приложение 2 · 9. Начало атаки слева',
   'a2-10':'Приложение 2 · 10. Усиление после начала атаки слева',
   'a2-11':'Приложение 2 · 11. Координация и реакция'
  };
  const exercises=[];
  const nodes=Array.from(main.childNodes);
  let card=null,figure=null,copy=null,key=null;
  for(const node of nodes){
    const val=node.nodeType===8?node.nodeValue.trim():'';
    const match=val.match(/^s88t-exercise-start:([a-z0-9-]+)$/);
    if(match){
      if(card)continue;
      key=match[1];
      card=document.createElement('section');
      card.className='exercise-card';
      card.id='exercise-'+key;
      card.setAttribute('aria-label',labels[key]||key);
      figure=document.createElement('div');figure.className='exercise-figure';
      copy=document.createElement('div');copy.className='exercise-copy';
      const meta=document.createElement('span');meta.className='exercise-meta';meta.textContent=labels[key]||key;copy.appendChild(meta);
      card.append(figure,copy);
      main.insertBefore(card,node);
      node.remove();
      continue;
    }
    if(val==='s88t-exercise-end'&&card){
      const a=document.createElement('a');
      a.href='#exercise-'+key;a.textContent='Ссылка на упражнение';a.className='exercise-link';
      copy.appendChild(a);
      exercises.push({key,card,figure,copy});
      card=null;key=null;figure=null;copy=null;node.remove();
      continue;
    }
    if(card){
      const img=node.nodeType===1 ? (node.matches('img')?node:node.querySelector('img')):null;
      if(img&&img.getAttribute('src')&&img.getAttribute('src').indexOf('/assets/crops/exercise-')>=0) figure.appendChild(node);
      else copy.appendChild(node);
    }
  }
  // Plain-text numeric chart transcripts remain in the Markdown for agents.
  // Only the graph images are shown in the human-facing presentation.
  main.querySelectorAll('img[src*="/assets/crops/chart-"]').forEach(function(img){
    const el=img.closest('p');
    const prev=el&&el.previousElementSibling;
    if(prev&&prev.tagName==='PRE')prev.classList.add('chart-transcript');
  });
  const headings=Array.from(main.querySelectorAll(':scope > h2'));
  if(headings.length){
    const t=document.createElement('strong');t.textContent='Разделы сборника';nav.appendChild(t);
    headings.forEach(function(h,i){
      h.id='chapter-'+(i+1);
      const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.trim();nav.appendChild(a);
    });
    nav.classList.add('active');
  }
  if(!exercises.length)return;
  const reader=document.getElementById('exercise-reader');
  const launch=document.getElementById('open-reader');
  const prev=document.getElementById('reader-prev'),next=document.getElementById('reader-next');
  const close=document.getElementById('reader-close'),title=document.getElementById('reader-title');
  const count=document.getElementById('reader-count');
  const visual=document.getElementById('reader-visual'),body=document.getElementById('reader-text');
  let index=0,returnFocus=null;
  function render(i){
    index=Math.max(0,Math.min(exercises.length-1,i));
    const ex=exercises[index];
    title.textContent=labels[ex.key]||ex.key;
    count.textContent=(index+1)+' / '+exercises.length;
    prev.disabled=index===0;next.disabled=index===exercises.length-1;
    visual.replaceChildren();
    body.replaceChildren();
    Array.from(ex.figure.children).forEach(n=>visual.appendChild(n.cloneNode(true)));
    Array.from(ex.copy.children).forEach(n=>{
      if(!n.classList.contains('exercise-link')&&!n.classList.contains('exercise-launch'))body.appendChild(n.cloneNode(true));
    });
    visual.scrollTop=0;body.scrollTop=0;
    if(history.replaceState)history.replaceState(null,'','#exercise-'+ex.key);
  }
  function open(i){
    returnFocus=document.activeElement;
    reader.classList.add('open');
    reader.setAttribute('aria-hidden','false');
    document.body.classList.add('reader-open');
    render(i);close.focus();
  }
  function shut(){
    reader.classList.remove('open');reader.setAttribute('aria-hidden','true');
    document.body.classList.remove('reader-open');
    if(returnFocus&&returnFocus.focus)returnFocus.focus();
  }
  launch.hidden=false;
  launch.textContent='Упражнения ('+exercises.length+')';
  launch.addEventListener('click',()=>open(0));
  prev.addEventListener('click',()=>render(index-1));
  next.addEventListener('click',()=>render(index+1));
  close.addEventListener('click',shut);
  exercises.forEach((ex,i)=>{
    const button=document.createElement('button');
    button.type='button';button.className='action exercise-launch';
    button.textContent='Открыть в режиме упражнений';
    button.style.marginTop='.5rem';
    button.addEventListener('click',()=>open(i));
    ex.copy.appendChild(button);
  });
  document.addEventListener('keydown',function(e){
    if(!reader.classList.contains('open'))return;
    if(e.key==='Escape'){e.preventDefault();shut();}
    if(e.key==='ArrowLeft'&&index>0){e.preventDefault();render(index-1);}
    if(e.key==='ArrowRight'&&index<exercises.length-1){e.preventDefault();render(index+1);}
    if(e.key==='Tab'){
      const focusable=Array.from(reader.querySelectorAll('button:not([disabled])'));
      if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable[focusable.length-1].focus();}
      else if(!e.shiftKey&&document.activeElement===focusable[focusable.length-1]){e.preventDefault();focusable[0].focus();}
    }
  });
  const hash=(location.hash||'').replace('#exercise-','');
  const start=exercises.findIndex(x=>x.key===hash);
  if(location.hash.startsWith('#exercise-')&&start>=0)main.querySelector('#exercise-'+hash)?.scrollIntoView();
})();
</script>
</body>
</html>
