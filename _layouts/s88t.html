<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }}</title>
  <style>
    :root { --ink: #23282f; --soft: #555f6c; --line: #dce2e9; --paper: #ffffff; --bg: #f4f6f8; --link: #155b9b; --highlight: #f0f6fc; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 17px/1.72 Georgia, "Times New Roman", serif; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:focus-visible, summary:focus-visible { outline: 3px solid #236ab5; outline-offset: 3px; }
    .skip { position: absolute; left: -100vw; top: 0; padding: .7rem; background: white; z-index: 2; }
    .skip:focus { left: .5rem; }
    .mast { background: #1b3045; color: white; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mast-inner { max-width: 940px; margin: auto; padding: .9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }
    .mast strong { font-size: .92rem; letter-spacing: .01em; }
    .mast a { color: #e4f1ff; white-space: nowrap; }
    .mast nav { display: flex; gap: 1rem; align-items: center; }
    .paper { max-width: 940px; margin: 2rem auto 3.5rem; padding: 3rem 4rem 4rem; background: var(--paper); box-shadow: 0 6px 32px rgba(28,45,63,.07); border: 1px solid var(--line); border-radius: 6px; }
    .paper > :first-child { margin-top: 0; }
    h1, h2, h3, h4, h5 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #213b54; line-height: 1.32; overflow-wrap: anywhere; scroll-margin-top: 1.5rem; }
    h1 { font-size: clamp(1.7rem,3vw,2.3rem); margin: 1.4rem 0 1.6rem; }
    h2 { font-size: clamp(1.35rem,2.3vw,1.7rem); margin: 3.2rem 0 1.3rem; padding-bottom: .45rem; border-bottom: 1px solid var(--line); }
    h3 { font-size: 1.19rem; margin: 2.1rem 0 .85rem; }
    h4 { font-size: 1.06rem; margin: 1.7rem 0 .8rem; }
    p, ul, ol { margin: 0 0 1.15rem; }
    li { margin: .35rem 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    blockquote { border-left: 4px solid #acc4da; padding: .1rem 1rem; margin: 1.5rem 0; background: var(--highlight); }
    pre { font: .88rem/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-x: auto; white-space: pre; background: #f6f8fa; border: 1px solid var(--line); padding: 1rem; border-radius: 4px; }
    code { overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; font-size: .91rem; }
    th, td { padding: .55rem .75rem; border: 1px solid var(--line); text-align: left; }
    th { background: var(--highlight); }
    details { margin: 1.6rem 0 2rem; border: 1px solid var(--line); background: #fbfcfd; border-radius: 5px; padding: .75rem 1rem; }
    summary { cursor: pointer; color: #234e73; font: 600 .92rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    details[open] summary { margin-bottom: 1.2rem; }
    details img, .paper img { max-width: 100%; height: auto; display: block; }
    details img { margin: 0 auto; border: 1px solid #e5e8ec; }
    .chapter-nav { max-width: 940px; margin: 0 auto; padding: 1rem 1.5rem 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: none; }
    .chapter-nav.active { display: block; }
    .chapter-nav strong { display: block; color: var(--soft); margin-bottom: .4rem; }
    .chapter-nav a { display: inline-block; margin: .25rem 1rem .25rem 0; }
    .footer { font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--soft); text-align: center; padding: 0 1rem 2rem; }
    @media (max-width: 650px) {
      body { font-size: 16px; line-height: 1.68; background: white; }
      .mast-inner { padding: .8rem 1rem; }
      .paper { margin: 0; padding: 1.5rem 1.1rem 2.5rem; box-shadow: none; border: 0; border-radius: 0; }
      .chapter-nav { padding: .75rem 1.1rem; }
      h2 { margin-top: 2.5rem; }
    }
    @media print { body { background: white; } .mast, .chapter-nav, .footer { display: none !important; } .paper { border: 0; box-shadow: none; margin: 0; padding: 0; max-width: none; } details { break-inside: avoid; } }
  </style>
</head>
<body>
  <a class="skip" href="#publication">К тексту сборника</a>
  <header class="mast">
    <div class="mast-inner">
      <strong>Сборник методических материалов № 1 · 2011</strong>
      <nav aria-label="Ссылки">
        <a href="https://github.com/t39s/dev-sandbox/blob/main/s88t/index.md">Markdown</a>
        <a href="https://github.com/t39s/dev-sandbox/tree/main/s88t">Репозиторий</a>
      </nav>
    </div>
  </header>
  <nav id="chapters" class="chapter-nav" aria-label="Разделы сборника"></nav>
  <main id="publication" class="paper">
    {{ content }}
  </main>
  <footer class="footer">Федерация настольного тенниса России · Москва, 2011. Текстовая версия подготовлена по оригинальному PDF.</footer>
  <script>
    (function () {
      const nav = document.getElementById('chapters');
      const headings = Array.from(document.querySelectorAll('#publication h2'));
      if (!nav || !headings.length) return;
      const title = document.createElement('strong');
      title.textContent = 'Переход к разделам';
      nav.appendChild(title);
      headings.forEach(function (h, i) {
        const id = 'chapter-' + (i + 1);
        h.id = id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent.trim();
        nav.appendChild(a);
      });
      nav.classList.add('active');
    })();
  </script>
</body>
</html>
