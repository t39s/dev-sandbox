<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Крестики — Нолики</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Крестики — Нолики</h1>
    <p class="mode-note">
      Вы — <strong class="mark-label mark-x-label">X</strong>.
      Алгоритм — <strong class="mark-label mark-o-label">O</strong> и играет без ошибок.
      Цель — добиться ничьей.
    </p>

    <section class="scoreboard" aria-label="Счёт серии">
      <div class="score-item">
        <span>Ничьи</span>
        <strong id="score-draws">0</strong>
      </div>
      <div class="score-item">
        <span>Алгоритм</span>
        <strong id="score-algorithm">0</strong>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite">Ваш ход (X)</p>

    <section
      id="board"
      class="board"
      aria-label="Игровое поле 3 на 3"
      aria-busy="false"
    >
      <button type="button" class="cell" data-index="0" aria-label="Клетка 1: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="1" aria-label="Клетка 2: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="2" aria-label="Клетка 3: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="3" aria-label="Клетка 4: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="4" aria-label="Клетка 5: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="5" aria-label="Клетка 6: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="6" aria-label="Клетка 7: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="7" aria-label="Клетка 8: пусто" aria-disabled="false"></button>
      <button type="button" class="cell" data-index="8" aria-label="Клетка 9: пусто" aria-disabled="false"></button>
    </section>

    <div class="actions">
      <button type="button" id="restart" class="restart">Новая игра</button>

      <div class="reset-control">
        <button
          type="button"
          id="reset-score"
          class="secondary"
          aria-controls="reset-score-confirmation"
          aria-expanded="false"
        >
          Сбросить счёт
        </button>

        <div
          id="reset-score-confirmation"
          class="reset-confirmation"
          role="group"
          aria-label="Подтверждение сброса счёта"
          hidden
        >
          <span>Сбросить весь счёт?</span>
          <button type="button" id="confirm-reset-score" class="danger-compact">Да</button>
          <button type="button" id="cancel-reset-score" class="secondary-compact">Нет</button>
        </div>
      </div>
    </div>
  </main>

  <script src="game-model.js"></script>
  <script src="ai-model.js"></script>
  <script src="score-model.js"></script>
  <script src="script.js"></script>
</body>
</html>
