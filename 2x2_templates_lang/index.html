<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2x2 — устный счёт</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <section id="setup" class="screen">
    <header class="top"><div><div class="eyebrow">2x2 Templates v1 · prototype</div><h1 id="setTitle">Загрузка…</h1><div id="setMeta" class="muted"></div></div></header>
    <div id="diagnostics" class="notice" hidden></div>
    <div id="resumeBox" class="resume" hidden><p></p><div class="row"><button id="resumeBtn" class="primary">Продолжить без зачёта</button><button id="restartBtn">Начать заново</button></div></div>
    <div class="toolbar"><button id="loadFileBtn">Загрузить задания</button><input id="fileInput" type="file" accept="application/json,.json" hidden><button id="stockBtn">Штатный набор</button><button id="demoBtn">Демо генератора</button></div>

    <section id="candidateBox" class="candidate" hidden>
      <div class="eyebrow">Проверенный импорт — ещё не активирован</div>
      <h2 id="candidateTitle"></h2><div id="candidateMeta" class="muted"></div>
      <div id="candidateLevels" class="level-grid compact"></div>
      <div id="candidatePreview" class="preview"></div>
      <div class="row"><button id="useCandidateBtn" class="primary">Использовать набор</button><button id="discardCandidateBtn">Отменить импорт</button></div>
    </section>
    <h2>Уровни</h2><div id="levels" class="level-grid"></div>
    <div id="preview" class="preview"></div>
    <div class="sticky-actions"><button id="startBtn" class="primary" disabled>Начать тренировку</button></div>
    <div id="prepareBox" class="prepare" hidden><span id="prepareText">Подготовка…</span><button id="cancelPrepare">Отменить</button></div>
  </section>

  <section id="practice" class="screen practice" hidden>
    <header class="practice-head"><div><div id="levelTitle" class="level-label"></div><div id="progress" class="muted"></div></div></header>
    <div id="problem" class="problem" aria-live="polite"></div>
    <div id="answer" class="answer" role="textbox" aria-label="Введённый ответ"> </div>
    <div id="feedback" class="feedback" aria-live="assertive"></div>
    <div id="keypad" class="keypad" aria-label="Цифровая клавиатура">
      <button data-action="1">1</button><button data-action="2">2</button><button data-action="3">3</button>
      <button data-action="4">4</button><button data-action="5">5</button><button data-action="6">6</button>
      <button data-action="7">7</button><button data-action="8">8</button><button data-action="9">9</button>
      <button data-action="sign" aria-label="Сменить знак">±</button><button data-action="0">0</button><button data-action="back" aria-label="Удалить символ">⌫</button>
    </div>
    <button id="submit" class="primary submit" disabled>Ответить</button>
  </section>

  <section id="report" class="screen" hidden>
    <div class="eyebrow">Результат</div><h1 id="reportTitle"></h1><p id="reportStats" class="report-stats"></p><div id="reportList" class="report-list"></div><button id="backBtn" class="primary">К уровням</button>
  </section>
</main>
<script src="core.js"></script><script src="app.js"></script>
</body>
</html>
